name: Finalize migrated dictation UI v2

on:
 push:
  branches: [audit/hanzi-ui-parity]

permissions:
 contents: write

concurrency:
 group: finalize-migrated-dictation-v2-${{ github.ref }}
 cancel-in-progress: true

jobs:
 finalize:
  if: ${{ !contains(github.event.head_commit.message, '[dictation-ui-finalized]') }}
  runs-on: ubuntu-latest
  timeout-minutes: 30
  env:
   HUSKY: 0
   NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  steps:
   - uses: actions/checkout@v5
     with:
      ref: audit/hanzi-ui-parity
      fetch-depth: 0
   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm
   - run: npm install --global npm@11.6.1
   - run: npm ci
   - name: Apply migrated dictation patch and preserve old listening UI
     run: |
      git fetch origin main
      git checkout origin/main -- \
       src/features/hanzihome/listening/ListeningDictationWorkspace.tsx \
       src/features/hanzihome/listening/MandarinTtsControls.tsx
      python - <<'PY'
      from pathlib import Path
      import textwrap

      workflow = Path('.github/workflows/finalize-migrated-dictation-ui.yml').read_text()
      start_marker = "      python - <<'PY'\n"
      start = workflow.index(start_marker) + len(start_marker)
      end = workflow.index("\n      PY", start)
      script = textwrap.dedent(workflow[start:end])
      exec(compile(script, 'migrated-dictation-patch.py', 'exec'), {})

      path = Path('src/features/hanzihome/practice/StudioDictationWorkspace.tsx')
      text = path.read_text()
      broken_tail = '  </div>\n );\n}   ) : null}\n  </div>\n );\n}'
      fixed_tail = '  </div>\n );\n}'
      if broken_tail not in text:
       raise SystemExit('expected duplicated dictation tail was not found')
      path.write_text(text.replace(broken_tail, fixed_tail, 1))
      PY
      git rm -f src/features/hanzihome/listening/ListeningTransport.tsx
   - run: npm run format
   - run: npm run check
   - name: Commit verified migrated dictation UI
     run: |
      git rm -f .github/workflows/finalize-migrated-dictation-ui.yml
      git rm -f .github/workflows/finalize-migrated-dictation-ui-v2.yml
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git commit -m "fix(hanzihome): match migrated dictation UX to source [dictation-ui-finalized]"
      git push origin HEAD:audit/hanzi-ui-parity
