name: Audit internal route integrity

on:
  push:
    branches:
      - audit/hanzi-ui-parity

permissions:
  contents: read

jobs:
  route-audit:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run route:check
      - run: npm run build
      - name: Start production server
        run: |
          npm start -- -p 3000 > /tmp/chines-app.log 2>&1 &
          echo $! > /tmp/chines-app.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/personal-learning > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chines-app.log
          exit 1
      - name: Smoke-test every public learning route
        run: |
          routes=(
            /reader
            /reader/course
            /reader/hsk
            /hsk
            /daily-reading
            /dictation
            /humanities
            /humanities/history
            /humanities/poetry
            /personal-learning
            /translation
            /tts
          )
          failed=0
          for route in "${routes[@]}"; do
            status=$(curl --silent --output /tmp/route-body --write-out '%{http_code}' --max-time 30 "http://127.0.0.1:3000${route}" || true)
            printf '%-28s %s\n' "$route" "$status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              failed=1
              echo "--- response for ${route} ---"
              head -c 1000 /tmp/route-body || true
              echo
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "--- server log ---"
            cat /tmp/chines-app.log
            exit 1
          fi
      - name: Render responsive browser matrix
        run: |
          mkdir -p /tmp/ui-audit/screenshots
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/ui-audit/chrome about:blank > /tmp/ui-audit/chrome.log 2>&1 &
          echo $! > /tmp/ui-audit/chrome.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9222/json/version > /dev/null; then
              break
            fi
            sleep 1
          done
          node <<'NODE'
          const fs = require("node:fs");
          const routes = [
            "/reader",
            "/reader/course",
            "/reader/hsk",
            "/hsk",
            "/daily-reading",
            "/dictation",
            "/humanities",
            "/humanities/history",
            "/humanities/poetry",
            "/personal-learning",
            "/translation",
            "/tts",
          ];
          const viewports = [
            { name: "phone", width: 390, height: 844 },
            { name: "ipad", width: 820, height: 1180 },
            { name: "desktop", width: 1440, height: 900 },
            { name: "wide", width: 1728, height: 1117 },
          ];
          const darkRoutes = new Set(["/reader", "/daily-reading", "/dictation", "/personal-learning"]);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          class CdpClient {
            constructor(url) {
              this.url = url;
              this.nextId = 1;
              this.pending = new Map();
              this.listeners = new Map();
            }
            async connect() {
              this.ws = new WebSocket(this.url);
              await new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error("CDP websocket timeout")), 10000);
                this.ws.onopen = () => { clearTimeout(timer); resolve(); };
                this.ws.onerror = (error) => { clearTimeout(timer); reject(error); };
              });
              this.ws.onmessage = (event) => {
                const message = JSON.parse(String(event.data));
                if (message.id) {
                  const pending = this.pending.get(message.id);
                  if (!pending) return;
                  this.pending.delete(message.id);
                  if (message.error) pending.reject(new Error(message.error.message));
                  else pending.resolve(message.result);
                  return;
                }
                const callbacks = this.listeners.get(message.method) ?? [];
                this.listeners.delete(message.method);
                callbacks.forEach((callback) => callback(message.params));
              };
            }
            send(method, params = {}) {
              const id = this.nextId++;
              return new Promise((resolve, reject) => {
                this.pending.set(id, { resolve, reject });
                this.ws.send(JSON.stringify({ id, method, params }));
              });
            }
            once(method, timeout = 20000) {
              return new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error(`Timed out waiting for ${method}`)), timeout);
                const callbacks = this.listeners.get(method) ?? [];
                callbacks.push((params) => { clearTimeout(timer); resolve(params); });
                this.listeners.set(method, callbacks);
              });
            }
            close() { this.ws.close(); }
          }

          async function openClient() {
            const page = await fetch("http://127.0.0.1:9222/json/new?http://127.0.0.1:3000/reader", { method: "PUT" }).then((response) => response.json());
            const client = new CdpClient(page.webSocketDebuggerUrl);
            await client.connect();
            await client.send("Page.enable");
            await client.send("Runtime.enable");
            return client;
          }

          async function navigate(client, route, viewport, theme) {
            await client.send("Emulation.setDeviceMetricsOverride", {
              width: viewport.width,
              height: viewport.height,
              deviceScaleFactor: 1,
              mobile: viewport.width <= 820,
              screenWidth: viewport.width,
              screenHeight: viewport.height,
            });
            await client.send("Emulation.setEmulatedMedia", {
              features: [{ name: "prefers-color-scheme", value: theme }],
            });
            let loaded = client.once("Page.loadEventFired");
            await client.send("Page.navigate", { url: `http://127.0.0.1:3000${route}` });
            await loaded;
            await sleep(250);
            await client.send("Runtime.evaluate", {
              expression: `localStorage.setItem("chines-app-theme", ${JSON.stringify(theme)}); localStorage.setItem("chines-app-theme-palette", "editorial");`,
            });
            loaded = client.once("Page.loadEventFired");
            await client.send("Page.reload", { ignoreCache: true });
            await loaded;
            await sleep(500);
          }

          async function auditPage(client, route, viewport, theme) {
            const expression = `(() => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity) !== 0 && rect.width > 0 && rect.height > 0;
              };
              const textOf = (element) => (element.getAttribute("aria-label") || element.getAttribute("title") || element.textContent || element.getAttribute("placeholder") || element.getAttribute("value") || "").trim().replace(/\\s+/g, " ").slice(0, 120);
              const interactiveSelector = 'a[href],button,input:not([type="hidden"]),textarea,select,[role="button"],[role="tab"],[role="menuitem"],[role="checkbox"],[role="switch"]';
              const interactive = [...document.querySelectorAll(interactiveSelector)].filter(visible);
              const duplicateIds = [...document.querySelectorAll("[id]")].map((node) => node.id).filter((id, index, all) => id && all.indexOf(id) !== index);
              const unlabeled = interactive.filter((element) => {
                const type = element.getAttribute("type");
                if ((type === "checkbox" || type === "radio") && element.labels?.length) return false;
                return textOf(element).length === 0;
              }).map((element) => ({ tag: element.tagName, role: element.getAttribute("role"), html: element.outerHTML.slice(0, 180) })).slice(0, 20);
              const smallTargets = interactive.map((element) => {
                const rect = element.getBoundingClientRect();
                const role = element.getAttribute("role");
                const inlineLink = element.tagName === "A" && Boolean(element.closest("p,li"));
                const labeledCheck = ["checkbox", "radio"].includes(element.getAttribute("type")) && element.labels?.length;
                const inToolbar = Boolean(element.closest('[role="toolbar"]'));
                const threshold = inlineLink || labeledCheck ? 0 : role === "menuitem" ? 40 : inToolbar ? 36 : 44;
                return { text: textOf(element), tag: element.tagName, role, width: Math.round(rect.width), height: Math.round(rect.height), threshold };
              }).filter((entry) => entry.threshold > 0 && (entry.width < entry.threshold || entry.height < entry.threshold)).slice(0, 30);
              const chromeRoot = document.querySelector("header,nav")?.parentElement ?? document.body;
              const cjkControls = interactive.filter((element) => /[\\u3400-\\u9fff]/u.test(textOf(element)) && (element.closest("header,nav,[role=tablist],[role=toolbar],[role=menu]") || chromeRoot === element)).map((element) => textOf(element)).slice(0, 30);
              const html = document.documentElement;
              const body = document.body;
              return {
                route: location.pathname,
                title: document.title,
                theme: document.documentElement.getAttribute("data-theme"),
                viewport: { width: innerWidth, height: innerHeight },
                overflowX: Math.max(html.scrollWidth, body?.scrollWidth || 0) - innerWidth,
                scrollHeight: Math.max(html.scrollHeight, body?.scrollHeight || 0),
                h1: [...document.querySelectorAll("h1")].map((node) => node.textContent?.trim()).filter(Boolean).slice(0, 5),
                mainCount: document.querySelectorAll("main").length,
                duplicateIds: [...new Set(duplicateIds)],
                unlabeled,
                smallTargets,
                cjkControls,
              };
            })()`;
            const evaluated = await client.send("Runtime.evaluate", { expression, returnByValue: true });
            const result = evaluated.result.value;
            const shot = await client.send("Page.captureScreenshot", { format: "png", captureBeyondViewport: false });
            const safeRoute = route === "/" ? "home" : route.slice(1).replaceAll("/", "__");
            fs.writeFileSync(`/tmp/ui-audit/screenshots/${safeRoute}__${viewport.name}__${theme}.png`, Buffer.from(shot.data, "base64"));
            return result;
          }

          (async () => {
            const client = await openClient();
            const report = [];
            for (const route of routes) {
              for (const viewport of viewports) {
                await navigate(client, route, viewport, "light");
                report.push(await auditPage(client, route, viewport, "light"));
              }
              if (darkRoutes.has(route)) {
                for (const viewport of [viewports[0], viewports[2]]) {
                  await navigate(client, route, viewport, "dark");
                  report.push(await auditPage(client, route, viewport, "dark"));
                }
              }
            }
            client.close();
            fs.writeFileSync("/tmp/ui-audit/report.json", JSON.stringify(report, null, 2));

            const hardFailures = report.flatMap((entry) => {
              const failures = [];
              if (entry.overflowX > 1) failures.push(`horizontal overflow ${entry.overflowX}px`);
              if (entry.mainCount !== 1) failures.push(`expected one <main>, found ${entry.mainCount}`);
              if (entry.duplicateIds.length) failures.push(`duplicate ids: ${entry.duplicateIds.join(", ")}`);
              if (entry.unlabeled.length) failures.push(`unlabeled controls: ${entry.unlabeled.length}`);
              return failures.map((failure) => `${entry.route} ${entry.viewport.width}x${entry.viewport.height} ${entry.theme}: ${failure}`);
            });
            const targetWarnings = report.filter((entry) => entry.smallTargets.length).map((entry) => `${entry.route} ${entry.viewport.width}x${entry.viewport.height} ${entry.theme}: ${entry.smallTargets.length} small targets`);
            const languageWarnings = report.filter((entry) => entry.cjkControls.length).map((entry) => `${entry.route} ${entry.viewport.width}x${entry.viewport.height} ${entry.theme}: CJK chrome -> ${entry.cjkControls.join(" | ")}`);

            console.log(`Rendered ${report.length} route/viewport/theme states.`);
            console.log(`Hard failures: ${hardFailures.length}`);
            hardFailures.forEach((line) => console.error(`ERROR ${line}`));
            console.log(`Touch-target warnings: ${targetWarnings.length}`);
            targetWarnings.slice(0, 80).forEach((line) => console.log(`WARN ${line}`));
            console.log(`CJK chrome warnings: ${languageWarnings.length}`);
            languageWarnings.slice(0, 80).forEach((line) => console.log(`WARN ${line}`));
            if (hardFailures.length) process.exit(1);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload UI audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-ui-browser-audit
          path: /tmp/ui-audit
          if-no-files-found: warn
          retention-days: 1
      - name: Stop audit processes
        if: always()
        run: |
          if [ -f /tmp/ui-audit/chrome.pid ]; then
            kill "$(cat /tmp/ui-audit/chrome.pid)" || true
          fi
          if [ -f /tmp/chines-app.pid ]; then
            kill "$(cat /tmp/chines-app.pid)" || true
          fi
