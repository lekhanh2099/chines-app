name: Temporary Hanzi Studio visual audit

on:
  push:
    branches: [audit/hanzi-ui-parity]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/hanzi-ui-parity
      - name: Audit source-style UI rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('src')
          source_files = [p for p in ROOT.rglob('*') if p.is_file() and p.suffix in {'.ts', '.tsx', '.css'}]

          checks = [
              ('fit/intrinsic layout patches', re.compile(r'\b(?:w-fit|h-fit|min-w-fit|max-w-fit|min-h-fit|max-h-fit|fit-content|min-content|max-content)\b')),
              ('pixel font sizes', re.compile(r'(?:text-\[[0-9.]+px\]|font-size:\s*[0-9.]+px)')),
              ('gradients', re.compile(r'(?:linear-gradient|radial-gradient|conic-gradient|bg-gradient|from-[a-z]|via-[a-z]|to-[a-z])')),
              ('raw browser scroll owners', re.compile(r'(?:scrollIntoView\(|window\.scrollTo\(|document\.documentElement\.scroll)')),
              ('viewport-height shell patches', re.compile(r'(?:h-screen|min-h-screen|100dvh|100vh|100svh|100lvh)')),
              ('raw color literals in TS/TSX', re.compile(r'(?:#[0-9A-Fa-f]{3,8}\b|rgba?\(|hsla?\(|oklch\()')),
              ('raw Tailwind palette utilities', re.compile(r'\b(?:bg|text|border|ring|outline|fill|stroke)-(?:white|black|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|fuchsia|pink|rose)(?:-|\b)')),
          ]

          for title, pattern in checks:
              print(f'=== {title} ===')
              for path in source_files:
                  if title == 'raw color literals in TS/TSX' and path.suffix == '.css':
                      continue
                  text = path.read_text(errors='ignore')
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          print(f'{path}:{line_no}:{line.strip()}')

          print('=== CSS files outside app/global owners ===')
          for path in source_files:
              if path.suffix == '.css' and path.parent != Path('src/app'):
                  print(path)

          print('=== theme percent/color-mix usage ===')
          pattern = re.compile(r'(?:color-mix\([^\n]*%|hsla?\([^\n]*%)')
          for path in [Path('src/app/globals.css'), Path('src/app/theme-palettes.css'), Path('src/app/surface-system.css')]:
              text = path.read_text()
              for line_no, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      print(f'{path}:{line_no}:{line.strip()}')
          PY
