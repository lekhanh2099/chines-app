name: Temporary Format UI Audit

on:
  push:
    branches:
      - audit/ui-ux-pro-max-full-2026-08-16

permissions:
  contents: write

concurrency:
  group: temp-format-ui-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Format audited files
        run: npx oxfmt --write docs/audits/ui-ux-pro-max-full-audit-2026-08-16.md src/components/ui/segmented-control.tsx

      - name: Verify formatting
        run: npx oxfmt --check docs/audits/ui-ux-pro-max-full-audit-2026-08-16.md src/components/ui/segmented-control.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/ui-ux-pro-max-full-audit-2026-08-16.md src/components/ui/segmented-control.tsx
          git commit -m "style(ui): normalize audited UI formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
