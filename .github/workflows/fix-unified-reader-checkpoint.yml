name: Fix unified reader checkpoint

on:
  push:
    branches:
      - refactor/unified-reader-2026-08-18

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/unified-reader-2026-08-18
      - name: Apply reader navigation and playback fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          runtime_path = "src/features/hanzihome/reader/runtime/ReaderRuntimeProvider.tsx"
          replace_once(
              runtime_path,
              "export type ReaderRuntimeCommands = {\n playCurrent: () => void;\n playAll: () => void;",
              "export type ReaderRuntimeCommands = {\n playCurrent: () => void;\n playFromCurrent: () => void;\n playAll: () => void;",
          )
          replace_once(
              runtime_path,
              "const noRuntimeCommands: ReaderRuntimeCommands = {\n playCurrent: () => undefined,\n playAll: () => undefined,",
              "const noRuntimeCommands: ReaderRuntimeCommands = {\n playCurrent: () => undefined,\n playFromCurrent: () => undefined,\n playAll: () => undefined,",
          )
          replace_once(
              runtime_path,
              "   playCurrent: () => commandsRef.current.playCurrent(),\n   playAll: () => commandsRef.current.playAll(),",
              "   playCurrent: () => commandsRef.current.playCurrent(),\n   playFromCurrent: () => commandsRef.current.playFromCurrent(),\n   playAll: () => commandsRef.current.playAll(),",
          )
          replace_once(
              runtime_path,
              "  commandsRef.current = {\n   playCurrent: () => startAt(store.state.activeIndex, false),\n   playAll: () => startAt(0, true),",
              "  commandsRef.current = {\n   playCurrent: () => startAt(store.state.activeIndex, false),\n   playFromCurrent: () => startAt(store.state.activeIndex, true),\n   playAll: () => startAt(0, true),",
          )

          surface_path = "src/features/hanzihome/reader/components/ReaderSurface.tsx"
          replace_once(
              surface_path,
              'import { getAppScrollContainer, scrollAppContentToElement } from "@/components/layout/app-scroll";',
              'import { getAppScrollContainer, resolveAppScrollTargetTop } from "@/components/layout/app-scroll";',
          )
          replace_once(
              surface_path,
              "const readerRateOptions: readonly number[] = [0.75, 0.9, 1, 1.1, 1.25];\n",
              """const readerRateOptions: readonly number[] = [0.75, 0.9, 1, 1.1, 1.25];

function getReaderScrollContainer(element: HTMLElement | null): HTMLElement | null {
 if (element && typeof window !== \"undefined\") {
  let current = element.parentElement;
  while (current) {
   const overflowY = window.getComputedStyle(current).overflowY;
   if ((overflowY === \"auto\" || overflowY === \"scroll\") && current.scrollHeight > current.clientHeight) {
    return current;
   }
   current = current.parentElement;
  }
 }
 return getAppScrollContainer();
}

function scrollReaderElementTo(element: HTMLElement | null, block: \"start\" | \"center\") {
 if (!element) return;
 const container = getReaderScrollContainer(element);
 if (!container) {
  element.scrollIntoView({ behavior: \"smooth\", block, inline: \"nearest\" });
  return;
 }
 const containerRect = container.getBoundingClientRect();
 const targetRect = element.getBoundingClientRect();
 const top = resolveAppScrollTargetTop({
  block,
  containerClientHeight: container.clientHeight,
  containerScrollTop: container.scrollTop,
  containerRect: {
   top: containerRect.top,
   bottom: containerRect.bottom,
   height: containerRect.height,
  },
  targetRect: {
   top: targetRect.top,
   bottom: targetRect.bottom,
   height: targetRect.height,
  },
 });
 container.scrollTo({ behavior: \"smooth\", left: 0, top });
}
""",
          )
          replace_once(
              surface_path,
              "  scrollAppContentToElement(segmentElementsRef.current.get(segment.id) ?? null, {\n   behavior: \"smooth\",\n   block: \"center\",\n  });",
              "  scrollReaderElementTo(segmentElementsRef.current.get(segment.id) ?? null, \"center\");",
          )
          replace_once(
              surface_path,
              " useEffect(() => {\n  const container = getAppScrollContainer();\n  if (!container || document.segments.length === 0) return;",
              " useEffect(() => {\n  const firstSegment = document.segments[0];\n  const container = getReaderScrollContainer(\n   firstSegment ? (segmentElementsRef.current.get(firstSegment.id) ?? null) : null,\n  );\n  if (!container || document.segments.length === 0) return;",
          )
          replace_once(
              surface_path,
              " }, [actions, document.segments]);\n\n const handleKeyDown = (event: KeyboardEvent<HTMLDivElement>) => {",
              """ }, [actions, document.segments]);

 const navigateToIndex = useCallback(
  (index: number) => {
   const segment = document.segments[index];
   if (!segment) return;
   commands.selectIndex(index);
   const element = segmentElementsRef.current.get(segment.id) ?? null;
   requestAnimationFrame(() => scrollReaderElementTo(element, \"start\"));
  },
  [commands, document.segments],
 );

 const handleKeyDown = (event: KeyboardEvent<HTMLDivElement>) => {""",
          )
          text = Path(surface_path).read_text()
          count = text.count("else commands.playCurrent();")
          if count != 2:
              raise SystemExit(f"Expected two primary playCurrent fallbacks, found {count}")
          Path(surface_path).write_text(text.replace("else commands.playCurrent();", "else commands.playFromCurrent();"))
          replace_once(
              surface_path,
              '<ReaderOutline document={document} />',
              '<ReaderOutline document={document} onNavigateToIndex={navigateToIndex} />',
          )
          replace_once(
              surface_path,
              '<ReaderOutlineContent document={document} onNavigate={() => setOutlineOpen(false)} />',
              '<ReaderOutlineContent\n      document={document}\n      onNavigateToIndex={navigateToIndex}\n      onNavigate={() => setOutlineOpen(false)}\n     />',
          )
          replace_once(
              surface_path,
              "function ReaderOutline({ document }: { document: ReaderDocumentModel }) {\n return (\n  <Card variant=\"section\" padding=\"md\" className=\"sticky top-3\">\n   <ReaderOutlineContent document={document} />",
              "function ReaderOutline({\n document,\n onNavigateToIndex,\n}: {\n document: ReaderDocumentModel;\n onNavigateToIndex: (index: number) => void;\n}) {\n return (\n  <Card variant=\"section\" padding=\"md\" className=\"sticky top-3\">\n   <ReaderOutlineContent document={document} onNavigateToIndex={onNavigateToIndex} />",
          )
          replace_once(
              surface_path,
              "function ReaderOutlineContent({\n document,\n onNavigate,\n}: {\n document: ReaderDocumentModel;\n onNavigate?: () => void;\n}) {\n const commands = useReaderRuntimeCommands();",
              "function ReaderOutlineContent({\n document,\n onNavigateToIndex,\n onNavigate,\n}: {\n document: ReaderDocumentModel;\n onNavigateToIndex: (index: number) => void;\n onNavigate?: () => void;\n}) {",
          )
          text = Path(surface_path).read_text()
          count = text.count("commands.selectIndex(targetIndex);")
          if count != 1:
              raise SystemExit(f"Expected one section outline selectIndex call, found {count}")
          text = text.replace("commands.selectIndex(targetIndex);", "onNavigateToIndex(targetIndex);")
          count = text.count("commands.selectIndex(index);")
          if count != 1:
              raise SystemExit(f"Expected one segment outline selectIndex call, found {count}")
          text = text.replace("commands.selectIndex(index);", "onNavigateToIndex(index);")
          Path(surface_path).write_text(text)
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
        env:
          HUSKY: 0
      - name: Format changed reader files
        run: |
          npx oxfmt --write \
            src/features/hanzihome/reader/components/ReaderSurface.tsx \
            src/features/hanzihome/reader/runtime/ReaderRuntimeProvider.tsx
      - name: Verify repository
        run: npm run check
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/features/hanzihome/reader/components/ReaderSurface.tsx \
            src/features/hanzihome/reader/runtime/ReaderRuntimeProvider.tsx
          git commit -m "fix(reader): scroll outline and continue playback"
          git push origin HEAD:refactor/unified-reader-2026-08-18
