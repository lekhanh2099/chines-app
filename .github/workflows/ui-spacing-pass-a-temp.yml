name: Temporary spacing pass A

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply audited spacing replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              file = Path(path); text = file.read_text(); found = text.count(old)
              if found != count: raise SystemExit(f"{path}: expected {count}, found {found}: {old!r}")
              file.write_text(text.replace(old, new))

          p="src/app/login/page.tsx"
          replace(p,'className="flex min-h-dvh flex-col justify-center bg-bg-primary px-4 py-[max(3rem,env(safe-area-inset-top))] sm:px-6 lg:px-8"','className="flex min-h-dvh flex-col justify-center gap-8 bg-bg-primary px-4 py-[max(3rem,env(safe-area-inset-top))] sm:px-6 lg:px-8"')
          replace(p,'className="flex flex-col items-center sm:mx-auto sm:w-full sm:max-w-md"','className="grid justify-items-center gap-2 sm:mx-auto sm:w-full sm:max-w-md"')
          replace(p,'className="app-brand-gradient mb-5 grid size-12 place-items-center rounded-2xl shadow-theme-sm"','className="app-brand-gradient grid size-12 place-items-center rounded-xl shadow-theme-sm"')
          replace(p,'className="mt-2 max-w-sm"','className="max-w-sm"')
          replace(p,'className="mt-8 sm:mx-auto sm:w-full sm:max-w-md"','className="sm:mx-auto sm:w-full sm:max-w-md"')
          replace(p,'className="border border-border-default bg-bg-card px-4 py-8 sm:rounded-xl sm:px-10"','className="grid gap-6 border border-border-default bg-bg-card px-4 py-8 sm:rounded-xl sm:px-10"')
          replace(p,'className="mb-6 w-full"','className="w-full"')
          replace(p,'className="mb-6 flex items-center gap-3 text-xs text-text-muted"','className="flex items-center gap-3 text-xs text-text-muted"')
          replace(p,'className="w-full mt-2"','className="w-full"')
          replace(p,'className="mt-6 flex flex-col gap-2 border-t border-border-default pt-6 text-center text-text-muted"','className="flex flex-col gap-2 border-t border-border-default pt-6 text-center text-text-muted"')

          p="src/components/notes/NoteEditorPanel.tsx"
          replace(p,'className="my-1 h-px bg-border-default"','className="h-3 py-1 before:block before:h-px before:bg-border-default"')
          replace(p,'className="note-editor-split-panel m-1 min-h-0 flex-1 overflow-hidden sm:m-2 lg:m-4"','className="note-editor-split-panel min-h-0 flex-1 overflow-hidden p-1 sm:p-2 lg:p-4"')
          replace(p,'className="note-editor-scroll m-1 sm:m-2 lg:m-4"','className="note-editor-scroll p-1 sm:p-2 lg:p-4"')

          p="src/components/notes/NoteTabContainer.tsx"
          replace(p,'className="flex h-full flex-col items-center justify-center bg-bg-primary text-text-muted"','className="flex h-full flex-col items-center justify-center gap-3 bg-bg-primary text-text-muted"')
          replace(p,'className="w-10 h-10 mb-3 opacity-40"','className="size-10 opacity-40"')

          p="src/components/vocabulary/VocabDetailDrawer.tsx"
          replace(p,'<div className="border-b border-border-default px-4 py-3 sm:px-5">\n    <div className="min-w-0">','<div className="border-b border-border-default px-4 py-3 sm:px-5">\n    <div className="grid min-w-0 gap-1">')
          replace(p,'className="mt-1">\n       {smartData.entry.pinyin}','>\n       {smartData.entry.pinyin}')
          replace(p,'<Card variant="subtle" padding="sm">\n      <Typography as="p" variant="caption" tone="warning" weight="bold">','<Card variant="subtle" padding="sm" className="grid gap-1">\n      <Typography as="p" variant="caption" tone="warning" weight="bold">')
          replace(p,'className="mt-1" />\n     </Card>','/>\n     </Card>')
          replace(p,'<span className="min-w-0">\n         <span className="flex flex-wrap items-center gap-2">','<span className="grid min-w-0 gap-1">\n         <span className="flex flex-wrap items-center gap-2">')
          replace(p,'className="mt-1 block"','className="block"')

          p="src/features/dictionary/DictionarySrsPage.tsx"
          replace(p,'<div className="min-w-0">\n           <LearnerHanziText','<div className="grid min-w-0 gap-1">\n           <LearnerHanziText')
          replace(p,'className="mt-1">\n            {item.pinyin','>\n            {item.pinyin')
          replace(p,'<Card variant="subtle" padding="sm" className="mt-1">','<Card variant="subtle" padding="sm">')

          p="src/features/dictionary/components/DictionaryWordSections.tsx"
          replace(p,'<div className="grid gap-4">\n    <div className="min-w-0">','<div className="grid gap-4">\n    <div className="grid min-w-0 gap-2">')
          replace(p,'className="mt-1 flex flex-wrap items-center gap-2.5"','className="flex flex-wrap items-center gap-2.5"')
          replace(p,'className="mt-3 grid gap-2"','className="grid gap-2"')
          replace(p,'className="mt-3 max-w-3xl"','className="max-w-3xl"')
          replace(p,'className="mt-3"\n      >\n       {viewModel.ai.source_metadata','>\n       {viewModel.ai.source_metadata')
          replace(p,'className="space-y-2"','className="grid gap-2"',2)
          replace(p,'className="space-y-2.5"','className="grid gap-2.5"')

          p="src/features/hanzihome/components/RadicalDetailPanel.tsx"
          replace(p,'<div className="min-w-0">\n     <div className="mb-2 flex flex-wrap items-center gap-2">','<div className="grid min-w-0 gap-2">\n     <div className="flex flex-wrap items-center gap-2">')

          p="src/features/hanzihome/components/RadicalWorkspace.tsx"
          replace(p,'<Card variant="subtle" padding="lg">\n        <StudyInstructionText','<Card variant="subtle" padding="lg" className="grid gap-1">\n        <StudyInstructionText')
          replace(p,'className="mt-1">\n         Thử đổi số nét','>\n         Thử đổi số nét')
          replace(p,'<div className="min-w-0">\n    <div className="flex flex-wrap items-center gap-2">','<div className="grid min-w-0 gap-2">\n    <div className="flex flex-wrap items-center gap-2">')
          replace(p,'className="mt-1"\n    >\n     {radical.coreMeaning','>\n     {radical.coreMeaning')
          replace(p,'className="mt-3">\n     #{radical.index}','>\n     #{radical.index}')

          p="src/features/hanzihome/components/VocabWritingCue.tsx"
          replace(p,'className={\n    !isShowAll\n     ? [\n        compact\n         ? "rounded-2xl border border-border-default bg-bg-primary p-4 shadow-theme-sm"\n         : "rounded-xl bg-bg-primary p-3 shadow-theme-sm sm:p-4",\n        className,\n       ].join(" ")\n     : className\n   }','className={[\n    "grid gap-2",\n    !isShowAll\n     ? compact\n       ? "rounded-xl border border-border-default bg-bg-primary p-4 shadow-theme-sm"\n       : "rounded-xl bg-bg-primary p-3 shadow-theme-sm sm:p-4"\n     : "",\n    className,\n   ].join(" ")}')
          replace(p,'"relative mt-2 grid gap-4 md:items-start",','"relative grid gap-4 md:items-start",')

          p="src/features/hanzihome/components/aggregate-library/LessonContentPreviewPanel.tsx"
          replace(p,'className="rounded-xl bg-bg-subtle px-3 py-2"','className="grid gap-1 rounded-xl bg-bg-subtle px-3 py-2"',2)
          replace(p,'className="mr-2 rounded-full bg-bg-card px-2 py-0.5"','className="w-fit rounded-full bg-bg-card px-2 py-0.5"')
          PY
      - run: npm run format
      - run: git checkout -- .github/workflows/ui-spacing-pass-a-temp.yml
      - name: Commit spacing pass A
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: normalize spacing pass A"
          git push origin "HEAD:${HEAD_REF}"
