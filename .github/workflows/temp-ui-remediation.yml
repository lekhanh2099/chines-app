name: Temporary UI Remediation

on:
  push:
    branches:
      - audit/ui-ux-pro-max-full-2026-08-16

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audited UI remediations
        run: node scripts/temp-ui-remediate.mjs

      - name: Format changed files
        shell: bash
        run: git diff --name-only -z | xargs -0 -r npx oxfmt --write --no-error-on-unmatched-pattern

      - name: Run UI standards guard
        run: npm run ui:check

      - name: Run UI guard regression tests
        run: npx vitest run scripts/check-ui-standards.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Commit remediation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/check-ui-standards.mjs scripts/check-ui-standards.test.mjs
          git commit -m "fix(ui): remediate accessibility and responsive audit findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
