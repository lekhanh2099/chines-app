name: Temporary refactor formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-refactor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run format

      - name: Commit formatting
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format refactor branch"
          git push origin "HEAD:${HEAD_REF}"
