name: Temporary spacing pass B

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply audited spacing replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              file = Path(path); text = file.read_text(); found = text.count(old)
              if found != count: raise SystemExit(f"{path}: expected {count}, found {found}: {old!r}")
              file.write_text(text.replace(old, new))

          p="src/features/hanzihome/components/grammar/StructuredGrammarContent.tsx"
          replace(p,'<section className="rounded-xl border border-primary/20 bg-primary/8 p-4 shadow-theme-sm">','<section className="grid gap-3 rounded-xl border border-primary/20 bg-primary/8 p-4 shadow-theme-sm">')
          replace(p,'className="mt-3"\n     />','/>')

          p="src/features/hanzihome/components/lesson-overview/LessonModuleSidebarItem.tsx"
          replace(p,'<span className="min-w-0 flex-1">','<span className="grid min-w-0 flex-1 gap-0.5">')
          replace(p,'className="mt-0.5 block opacity-80"','className="block opacity-80"')

          p="src/features/hanzihome/components/lesson-overview/LessonReadingSettings.tsx"
          replace(p,'<Card variant="section" padding="lg">\n    <SettingsGroup','<Card variant="section" padding="lg" className="grid gap-5">\n    <SettingsGroup')
          replace(p,'<Separator className="my-5" />','<Separator />',4)
          replace(p,'<div className="min-w-0">\n          <Typography as="p" variant="label"','<div className="grid min-w-0 gap-0.5">\n          <Typography as="p" variant="label"')
          replace(p,'className="mt-0.5">\n           {disabled','>\n           {disabled')
          replace(p,'<Card variant="section" padding="lg" className="md:sticky md:top-4">','<Card variant="section" padding="lg" className="grid gap-5 md:sticky md:top-4">')
          replace(p,'<div>\n     <Typography as="h3" variant="sectionTitle"','<div className="grid gap-1">\n     <Typography as="h3" variant="sectionTitle"')
          replace(p,'className="mt-1">\n      Đây là cách nội dung học','>\n      Đây là cách nội dung học')
          replace(p,'<div className="mt-5">\n    <StudyInstructionText','<div className="grid gap-3">\n    <StudyInstructionText')
          replace(p,'<div className="mt-3">\n     <ProgressiveStudyText','<div>\n     <ProgressiveStudyText')
          replace(p,'<div>\n    <StudyInstructionText\n     variant="overline"','<div className="grid gap-2">\n    <StudyInstructionText\n     variant="overline"')
          replace(p,'className="mt-2">\n     Hoàn thành câu','>\n     Hoàn thành câu')
          replace(p,'className="mt-2 block">\n     我___','className="block">\n     我___')
          replace(p,'className="mt-2">\n      Đáp án hiển thị','>\n      Đáp án hiển thị')
          replace(p,'className="mt-2">\n      Đáp án đang ẩn','>\n      Đáp án đang ẩn')

          p="src/features/hanzihome/components/lesson-overview/book-section/ProperNounCard.tsx"
          replace(p,'<details>\n       <summary','<details className="grid gap-2">\n       <summary')
          replace(p,'className="mt-2 flex flex-wrap gap-2"','className="flex flex-wrap gap-2"')

          p="src/features/hanzihome/components/lesson-overview/exercise-section/MatchingOptionCard.tsx"
          replace(p,'className="study-chip-accent mt-0.5 shrink-0 rounded-md border px-2 py-0.5"','className="study-chip-accent shrink-0 translate-y-0.5 rounded-md border px-2 py-0.5"')

          p="src/features/hanzihome/components/library/CourseCollectionSection.tsx"
          replace(p,'<div className="min-w-0">\n      <div className="flex flex-wrap items-center gap-2">','<div className="grid min-w-0 gap-1">\n      <div className="flex flex-wrap items-center gap-2">')
          replace(p,'className="mt-1">\n       {group.description}','>\n       {group.description}')
          replace(p,'<div className="min-w-0">\n           <div className="flex flex-wrap items-center gap-2">','<div className="grid min-w-0 gap-0.5">\n           <div className="flex flex-wrap items-center gap-2">')
          replace(p,'className="mt-0.5">\n             {course.subtitle}','>\n             {course.subtitle}')

          p="src/features/hanzihome/components/library/RecentLearningCard.tsx"
          replace(p,'<div className="min-w-0 flex-1">','<div className="grid min-w-0 flex-1 gap-1">')
          replace(p,'className="mt-1">\n      Bài {lesson.lessonNumber}','>\n      Bài {lesson.lessonNumber}')
          replace(p,'className="mt-0.5">\n      {course.title}','>\n      {course.title}')

          p="src/features/hanzihome/components/review/StudyReviewBack.tsx"
          replace(p,'<kbd className="ml-2 rounded bg-bg-subtle px-1.5 py-0.5 text-[0.65rem] font-black text-text-muted">','<kbd className="rounded-md bg-bg-subtle px-1.5 py-0.5 text-[0.65rem] font-black text-text-muted">')

          p="src/features/hanzihome/components/vocab-detail/VocabReadingSection.tsx"
          replace(p,'className="group rounded-2xl border border-border-default bg-bg-card p-4 shadow-theme-sm"','className="group grid gap-3 rounded-xl border border-border-default bg-bg-card p-4 shadow-theme-sm"')
          replace(p,'className="mt-3 grid gap-3 text-base leading-relaxed text-text-secondary"','className="grid gap-3 text-base leading-relaxed text-text-secondary"')

          p="src/features/hanzihome/listening/ListeningDictationWorkspace.tsx"
          replace(p,'<div className="text-center">\n     <StudyInstructionText tone="default" weight="black">\n      Không tải được bài nghe chép','<div className="grid gap-1 text-center">\n     <StudyInstructionText tone="default" weight="black">\n      Không tải được bài nghe chép')
          replace(p,'className="mt-1">\n      {query.error','>\n      {query.error')
          replace(p,'<Headphones className="mt-0.5 size-5 shrink-0 text-primary" />','<Headphones className="size-5 shrink-0 translate-y-0.5 text-primary" />')
          replace(p,'<div className="min-w-0">\n       <Badge variant="purple" className="mb-1 w-fit">','<div className="grid min-w-0 gap-1">\n       <Badge variant="purple" className="w-fit">')
          replace(p,'<div className="text-center">\n       <StudyInstructionText tone="default" weight="black">\n        Phần này chưa có script','<div className="grid gap-1 text-center">\n       <StudyInstructionText tone="default" weight="black">\n        Phần này chưa có script')
          replace(p,'className="mt-1">\n        Chọn đề mục khác','>\n        Chọn đề mục khác')

          p="src/features/hanzihome/listening/ListeningTranscriptBlock.tsx"
          replace(p,'<div>\n        <Badge','<div className="grid gap-1">\n        <Badge')
          replace(p,'className="mt-1 block">\n          {speaker.labelVi}','className="block">\n          {speaker.labelVi}')

          p="src/features/hanzihome/memory-tips/GlobalMemoryTipCard.tsx"
          replace(p,'<div className="min-w-0">\n       <StudyInstructionText','<div className="grid min-w-0 gap-1">\n       <StudyInstructionText')
          replace(p,'className="mt-1"\n       >\n        Thêm tip ngắn','>\n        Thêm tip ngắn')

          p="src/features/hanzihome/memory-tips/HanziHomeMemoryTipsPage.tsx"
          replace(p,'<div className="min-w-0 flex-1">\n     <div className="mb-2 flex flex-wrap items-center gap-2">','<div className="grid min-w-0 flex-1 gap-1">\n     <div className="flex flex-wrap items-center gap-2">')
          replace(p,'className="mt-1">\n      {tip.body}','>\n      {tip.body}')

          p="src/features/hanzihome/search/GlobalSearchDialog.tsx"
          replace(p,'className="min-h-0 flex-1 overscroll-contain overflow-y-auto px-2 py-2 scrollbar-soft"','className="grid min-h-0 flex-1 content-start gap-1 overscroll-contain overflow-y-auto px-2 py-2 scrollbar-soft"')
          replace(p,'className="mb-1 flex w-full"','className="flex w-full"')

          p="src/features/hanzihome/search/SearchResultItem.tsx"
          replace(p,'<span className="min-w-0">\n    <span className="flex min-w-0 items-center gap-2">','<span className="grid min-w-0 gap-0.5">\n    <span className="flex min-w-0 items-center gap-2">')
          replace(p,'className="mt-0.5 block"','className="block"')

          p="src/features/notebook/NotebookPage.tsx"
          replace(p,'<div>\n       <Typography as="h1" id="notebook-section-heading"','<div className="grid gap-1">\n       <Typography as="h1" id="notebook-section-heading"')
          replace(p,'className="mt-1 max-w-4xl"','className="max-w-4xl"')

          p="src/features/notebook/components/NotebookSectionGuide.tsx"
          replace(p,'<details className="group">','<details className="group grid gap-3">')
          replace(p,'className="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"','className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"')

          p="src/features/notes/components/NoteListRow.tsx"
          replace(p,'<IconTile tone={getContextTone(context.kind)} size="sm" className="mt-0.5">','<IconTile tone={getContextTone(context.kind)} size="sm" className="translate-y-0.5">')

          p="src/features/notes/components/NotesLibraryNavigator.tsx"
          replace(p,'className="ml-5 grid gap-1 border-l border-border-default pl-2"','className="relative grid gap-1 pl-7 before:absolute before:inset-y-0 before:left-5 before:w-px before:bg-border-default"')
          PY
      - run: npm run format
      - run: git checkout -- .github/workflows/ui-spacing-pass-b-temp.yml
      - name: Commit spacing pass B
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: normalize spacing pass B"
          git push origin "HEAD:${HEAD_REF}"
