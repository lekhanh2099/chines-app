name: Temporary UI owner polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Normalize owner-level micro contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              file=Path(path); text=file.read_text(); found=text.count(old)
              if found != count: raise SystemExit(f"{path}: expected {count}, found {found}: {old!r}")
              file.write_text(text.replace(old,new))

          replace(
              "src/components/ui/button.tsx",
              '"border-2 opacity-80 ring-offset-2 ring-offset-bg-card hover:opacity-100 aria-pressed:opacity-100 aria-pressed:ring-2 aria-pressed:ring-ring"',
              '"border-border-default opacity-80 hover:border-primary/45 hover:opacity-100 aria-pressed:border-primary aria-pressed:opacity-100"',
          )
          replace(
              "src/components/ui/select.tsx",
              'rounded-xl border border-border bg-popover',
              'rounded-xl border border-border-default bg-popover',
          )
          replace(
              "src/app/globals.css",
              '.dark .app-active-item {\n color: oklch(0.88 0.11 286.7462);\n box-shadow: none;\n}',
              '.dark .app-active-item {\n color: var(--primary);\n box-shadow: none;\n}',
          )
          PY
      - run: npm run format
      - run: git checkout -- .github/workflows/ui-owner-polish-temp.yml
      - name: Commit UI owner polish
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: polish UI owner contracts"
          git push origin "HEAD:${HEAD_REF}"
