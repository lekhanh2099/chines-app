name: UI audit vocabulary

on:
 push:
  branches: [audit/hanzi-ui-parity]

permissions:
 contents: write

concurrency:
 group: ui-audit-vocabulary-${{ github.ref }}
 cancel-in-progress: true

jobs:
 materialize:
  if: ${{ !contains(github.event.head_commit.message, '[ui-audit]') }}
  runs-on: ubuntu-latest
  timeout-minutes: 12
  env:
   HUSKY: 0
  steps:
   - uses: actions/checkout@v5
     with:
      ref: audit/hanzi-ui-parity
   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm
   - run: npm install --global npm@11.6.1
   - run: npm ci
   - name: Replace vocabulary cards with canonical table
     run: |
      python - <<'PY'
      from pathlib import Path

      path = Path('src/features/hanzihome/reader/ReaderDocumentStudy.tsx')
      text = path.read_text()
      import_marker = 'import { ReaderHeaderContextBridge } from "./ReaderHeaderContextBridge";\n'
      if 'ReaderVocabularyPanel' not in text:
          if import_marker not in text:
              raise SystemExit('reader import marker missing')
          text = text.replace(
              import_marker,
              import_marker + 'import { ReaderVocabularyPanel } from "./ReaderVocabularyPanel";\n',
              1,
          )

      start = text.find('       {showVocabularyTab ? (\n')
      end = text.find('       {showTranslationTab ? (\n', start)
      if start < 0 or end < 0:
          raise SystemExit('reader vocabulary section markers missing')
      replacement = '''       {showVocabularyTab ? (\n        <ReaderVocabularyPanel vocabulary={resource.vocabulary} />\n       ) : null}\n\n'''
      path.write_text(text[:start] + replacement + text[end:])
      PY
   - run: npx --no-install oxfmt --write src/features/hanzihome/reader/ReaderDocumentStudy.tsx src/features/hanzihome/reader/ReaderVocabularyPanel.tsx src/components/ui/data-table.tsx
   - name: Commit vocabulary parity changes
     run: |
      if git diff --quiet -- src/features/hanzihome/reader/ReaderDocumentStudy.tsx; then
       exit 0
      fi
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add src/features/hanzihome/reader/ReaderDocumentStudy.tsx src/features/hanzihome/reader/ReaderVocabularyPanel.tsx src/components/ui/data-table.tsx
      git commit -m "refactor(ui): use source-aligned vocabulary table [ui-audit]"
      git push origin HEAD:audit/hanzi-ui-parity
