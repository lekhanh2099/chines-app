name: Migrate Business Chinese JSON

on:
 push:
  branches:
   - feature/han-thuong-mai-study

permissions:
 contents: write

jobs:
 migrate:
  if: github.actor != 'github-actions[bot]'
  runs-on: ubuntu-latest
  steps:
   - name: Checkout feature branch
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      git init .
      git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      git fetch --depth=1 origin feature/han-thuong-mai-study
      git checkout -B feature/han-thuong-mai-study FETCH_HEAD

   - name: Generate direct JSON data
     run: node scripts/migrate-business-chinese-json.mjs

   - name: Remove one-time migration helpers
     run: |
      rm scripts/migrate-business-chinese-json.mjs
      rm .github/workflows/migrate-business-chinese-json.yml

   - name: Commit JSON migration
     run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git diff --cached --check
      git commit -m "fix(business-chinese): replace compressed chunks with json"
      git push origin HEAD:feature/han-thuong-mai-study
