name: Temporary spacing pass C

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply spacing pass C
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              file=Path(path); text=file.read_text(); found=text.count(old)
              if found != count: raise SystemExit(f"{path}: expected {count}, found {found}: {old!r}")
              file.write_text(text.replace(old,new))

          p="src/features/settings/SettingsPageContent.tsx"
          replace(p,'className="mt-4 grid gap-4"','className="grid gap-4 pt-4"')
          replace(p,'className="mt-4">\n      {readingSettings}','className="pt-4">\n      {readingSettings}')
          replace(p,'className="mt-4 grid gap-5"','className="grid gap-5 pt-4"')
          replace(p,'<div className="min-w-0 max-w-3xl">\n        <Badge variant="accent"','<div className="grid min-w-0 max-w-3xl gap-2">\n        <Badge variant="accent"')
          replace(p,'className="mt-2">\n         Cài đặt tra cứu AI','>\n         Cài đặt tra cứu AI')
          replace(p,'className="mt-1">\n         Tra nhanh ưu tiên','>\n         Tra nhanh ưu tiên')
          replace(p,'<div className="mt-3">\n         <Badge variant={hasUnsavedChanges ? "warning" : "success"} size="md">','<div>\n         <Badge variant={hasUnsavedChanges ? "warning" : "success"} size="md">')
          replace(p,'<div>\n         <Typography as="p" tone="default" weight="semibold">\n          {getGeminiModelLabel(DEFAULT_GEMINI_QUICK_MODEL)}','<div className="grid gap-1">\n         <Typography as="p" tone="default" weight="semibold">\n          {getGeminiModelLabel(DEFAULT_GEMINI_QUICK_MODEL)}')
          replace(p,'className="mt-1">\n          Tối ưu độ trễ','>\n          Tối ưu độ trễ')
          replace(p,'className="space-y-4"','className="grid gap-4"')
          replace(p,'<div className="min-w-0">\n    <Typography as="h2" variant="sectionTitle"','<div className="grid min-w-0 gap-1">\n    <Typography as="h2" variant="sectionTitle"')
          replace(p,'className="mt-1">\n     {description}','>\n     {description}')
          replace(p,'className="min-w-0 space-y-1"','className="grid min-w-0 gap-1"')
          replace(p,'<Card variant="default" padding="lg">\n   <div className="mb-4 flex items-start justify-between gap-4">','<Card variant="default" padding="lg" className="grid gap-4">\n   <div className="flex items-start justify-between gap-4">')
          replace(p,'className="space-y-2"','className="grid gap-2"')
          replace(p,'<div className="mb-3 flex items-center justify-between">','<div className="flex items-center justify-between gap-3">')

          p="src/components/settings/ApiKeyManagerSection.tsx"
          replace(p,'import { Button } from "@/components/ui/button";','import { Button } from "@/components/ui/button";\nimport { Card } from "@/components/ui/card";')
          replace(p,'<section className="rounded-2xl border border-border-default bg-bg-card p-6 shadow-theme-sm">','<Card variant="section" padding="lg" className="grid gap-5">')
          replace(p,'className="mt-5 rounded-2xl border border-warning/30 bg-warning-subtle px-4 py-3 leading-6 text-warning-text"','className="rounded-xl border border-warning/30 bg-warning-subtle px-4 py-3 leading-6 text-warning-text"')
          replace(p,'className="mt-5"','')
          replace(p,'className="mt-6 flex flex-col items-start gap-3 rounded-2xl border border-danger/30 bg-danger/5 p-5 text-danger-text"','className="flex flex-col items-start gap-3 rounded-xl border border-danger/30 bg-danger/5 p-5 text-danger-text"')
          replace(p,'className="mt-6 flex items-center gap-3 rounded-2xl border border-border-default bg-bg-primary p-5  text-text-secondary"','className="flex items-center gap-3 rounded-xl border border-border-default bg-bg-primary p-5 text-text-secondary"')
          replace(p,'className="mt-6 flex items-center gap-3 rounded-xl border border-dashed border-border-default bg-bg-primary p-4"','className="flex items-center gap-3 rounded-xl border border-dashed border-border-default bg-bg-primary p-4"')
          replace(p,'className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-accent-subtle text-accent-text"','className="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-accent-subtle text-accent-text"')
          replace(p,'<div>\n      <Typography as="p" tone="default" weight="semibold">\n       Chưa có API key cá nhân','<div className="grid gap-1">\n      <Typography as="p" tone="default" weight="semibold">\n       Chưa có API key cá nhân')
          replace(p,'className="mt-1">\n       {schemaReady','>\n       {schemaReady')
          replace(p,'className="mt-6 divide-y divide-border-default border-y border-border-default"','className="divide-y divide-border-default border-y border-border-default"')
          replace(p,'className="min-w-0 space-y-2"','className="grid min-w-0 gap-2"')
          replace(p,'<div className="min-w-0">\n           <Typography as="h3"','<div className="grid min-w-0 gap-1">\n           <Typography as="h3"')
          replace(p,'className="mt-1">\n            {key.maskedKey}','>\n            {key.maskedKey}')
          # Close only the root Card immediately before the component return terminator.
          replace(p,'  </section>\n );\n}','  </Card>\n );\n}')
          PY
      - run: npm run format
      - run: git checkout -- .github/workflows/ui-spacing-pass-c-temp.yml
      - name: Commit spacing pass C
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: normalize settings spacing"
          git push origin "HEAD:${HEAD_REF}"
