name: UI audit retry

on:
 push:
  branches: [audit/hanzi-ui-parity]

permissions:
 contents: write

concurrency:
 group: ui-audit-retry-${{ github.ref }}
 cancel-in-progress: true

jobs:
 patch-and-verify:
  if: ${{ !contains(github.event.head_commit.message, '[ui-audit]') }}
  runs-on: ubuntu-latest
  timeout-minutes: 25
  env:
   HUSKY: 0
   NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  steps:
   - uses: actions/checkout@v5
     with:
      ref: audit/hanzi-ui-parity
   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm
   - run: npm install --global npm@11.6.1
   - run: npm ci
   - name: Apply UI parity edits
     run: |
      python - <<'PY'
      from pathlib import Path

      def replace_all(path: Path, pairs: list[tuple[str, str]]) -> None:
          text = path.read_text()
          for old, new in pairs:
              text = text.replace(old, new)
          path.write_text(text)

      def replace_one(path: Path, old: str, new: str) -> None:
          text = path.read_text()
          if old not in text:
              raise SystemExit(f"missing marker in {path}: {old[:120]!r}")
          path.write_text(text.replace(old, new, 1))

      def replace_between(path: Path, start: str, end: str, new: str) -> None:
          text = path.read_text()
          a = text.find(start)
          b = text.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit(f"range marker missing in {path}")
          path.write_text(text[:a] + new + text[b:])

      reader = Path("src/features/hanzihome/reader/ReaderDocumentStudy.tsx")
      replace_all(reader, [
          ('const pinyinMode = pinyinModeOverride ?? (state.showPinyin ? "contextual" : "off");', 'const pinyinMode = pinyinModeOverride ?? (state.showPinyin ? "focus" : "off");'),
          ('gap-3 border-b border-border-default pb-4">', 'gap-3 border-b border-border-default pb-4 sm:pb-5">'),
          ('className="text-3xl sm:text-4xl"', 'className="text-2xl sm:text-3xl"'),
          ('resource.document.title_vi || resource.document.genre_vi || "HanziHome Reader"', 'resource.document.title_vi || resource.document.genre_vi || "Bài đọc"'),
          ('Daily Reading context', 'Thông tin bài đọc'),
          ('Personal Learning map', 'Bản đồ học cá nhân'),
          ('Evidence: {personalSourceIds.join(", ")}', 'Nguồn: {personalSourceIds.join(", ")}'),
          ('Annotation của đoạn này', 'Ghi chú của đoạn này'),
          ('Bỏ override của đoạn này', 'Bỏ cách đọc tuỳ chỉnh'),
          ('Từ và cụm từ được resolve từ vocabulary canonical của HanziHome.', 'Từ và cụm từ trong bài, tra nhanh theo chữ Hán, pinyin và nghĩa.'),
          ('Translation Studio', 'Luyện dịch'),
          ('Luyện dịch hai chiều theo từng đoạn, chấm deterministic và lưu attempt HanziHome.', 'Luyện dịch hai chiều theo từng đoạn và lưu tiến độ học.'),
          ('{ key: "zh-vi", label: "中文 → Tiếng Việt" }', '{ key: "zh-vi", label: "Tiếng Trung → Tiếng Việt" }'),
          ('{ key: "vi-zh", label: "Tiếng Việt → 中文" }', '{ key: "vi-zh", label: "Tiếng Việt → Tiếng Trung" }'),
          ('Dictation Studio', 'Luyện nghe chép'),
          ('Mở Dictation →', 'Mở chép chính tả →'),
          ('Mở TTS Studio', 'Mở tạo giọng đọc'),
      ])

      replace_between(
          reader,
          '       {showOverviewTab && !state.focusMode ? (\n',
          '       {stateOwner === "daily" ? (\n',
          '''       {showOverviewTab && !state.focusMode ? (\n        <div className="grid gap-4 lg:grid-cols-2">\n         <Card variant="subtle" padding="lg" className="grid content-start gap-3">\n          <Typography as="h2" variant="cardTitle" weight="black">Bài này là gì?</Typography>\n          <Typography variant="bodySmall" weight="black">\n           {resource.document.genre_vi || readerLessonLabel}\n          </Typography>\n          <Typography variant="bodySmall" tone="muted">\n           {resource.document.analysis.mainIdeaVi ||\n            "Đọc để nắm nội dung chính và cách triển khai của văn bản."}\n          </Typography>\n         </Card>\n         <Card variant="subtle" padding="lg" className="grid content-start gap-3">\n          <Typography as="h2" variant="cardTitle" weight="black">Mục tiêu bài học</Typography>\n          {resource.document.objectives_vi.length > 0 ? (\n           <ul className="grid gap-2 pl-5 text-sm text-foreground-muted">\n            {resource.document.objectives_vi.map((objective) => <li key={objective}>{objective}</li>)}\n           </ul>\n          ) : (\n           <Typography variant="bodySmall" tone="muted">\n            Đọc hiểu nội dung, nhận diện từ vựng trọng tâm và diễn đạt lại ý chính.\n           </Typography>\n          )}\n         </Card>\n         <Card variant="subtle" padding="lg" className="grid content-start gap-3">\n          <Typography as="h2" variant="cardTitle" weight="black">Trước khi đọc</Typography>\n          <ol className="grid gap-2 pl-5 text-sm text-foreground-muted">\n           <li>Đọc lướt tiêu đề và xác định chủ đề trước khi mở pinyin.</li>\n           <li>Đánh dấu câu hoặc cụm chưa chắc thay vì tra ngay từng từ.</li>\n           <li>Thử tóm tắt mỗi đoạn bằng một ý ngắn sau lần đọc đầu.</li>\n          </ol>\n         </Card>\n         <Card variant="subtle" padding="lg" className="grid content-start gap-3">\n          <Typography as="h2" variant="cardTitle" weight="black">Nhịp học gợi ý</Typography>\n          <ol className="grid gap-2 pl-5 text-sm text-foreground-muted">\n           <li>Đọc bài và nghe từng đoạn.</li>\n           <li>Làm bài tập khi nội dung còn mới.</li>\n           <li>Ôn từ vựng theo ngữ cảnh của bài.</li>\n           <li>Luyện dịch để kiểm tra khả năng diễn đạt.</li>\n           <li>Chép chính tả hoặc shadowing để củng cố nghe nói.</li>\n          </ol>\n         </Card>\n        </div>\n       ) : null}\n\n''',
      )
      replace_one(reader, '<Card variant="section" padding="md" className="grid gap-0">', '<Card variant="canvas" padding="none" className="grid gap-0 px-1 sm:px-3 lg:px-6">')
      replace_one(
          reader,
          '''             className={\n              isActive\n               ? "grid gap-4 bg-bg-subtle py-5 first:pt-4 last:pb-0 sm:px-4"\n               : "grid gap-4 border-b border-border-default py-5 last:border-b-0 sm:px-4"\n             }''',
          '             className="mx-auto grid w-full max-w-4xl gap-4 border-b border-border-default py-7 first:pt-4 last:border-b-0 last:pb-4 sm:px-4"',
      )
      replace_one(
          reader,
          '''              <Button\n               type="button"\n               size="sm"\n               variant={isActive ? "active" : "ghost"}\n               onClick={() => {\n                move(index);\n                playParagraphAt(index);\n               }}\n              >\n               Nghe đoạn này\n              </Button>''',
          '''              <Button\n               type="button"\n               size="icon-sm"\n               variant="ghost"\n               aria-label={`Nghe đoạn ${paragraph.paragraph_order}`}\n               title="Nghe đoạn này"\n               onClick={() => {\n                move(index);\n                playParagraphAt(index);\n               }}\n              >\n               <Volume2 aria-hidden="true" />\n              </Button>''',
      )

      daily = Path("src/features/hanzihome/reader/DailyReadingWorkspace.tsx")
      replace_all(daily, [
          ('{ id: "reader", label: "阅读" }', '{ id: "reader", label: "Đọc bài" }'),
          ('{ id: "questions", label: "问题" }', '{ id: "questions", label: "Câu hỏi" }'),
          ('{ id: "vocabulary", label: "词汇" }', '{ id: "vocabulary", label: "Từ vựng" }'),
          ('{ id: "grammar", label: "语法" }', '{ id: "grammar", label: "Ngữ pháp" }'),
          ('{ id: "translation", label: "翻译" }', '{ id: "translation", label: "Bản dịch" }'),
          ('{ id: "source", label: "来源" }', '{ id: "source", label: "Nguồn" }'),
          ('eyebrow="今日阅读"', 'eyebrow="Bài đọc hôm nay"'),
          ('{ key: "zh-vi", label: "中文 → Tiếng Việt" }', '{ key: "zh-vi", label: "Tiếng Trung → Tiếng Việt" }'),
          ('{ key: "vi-zh", label: "Tiếng Việt → 中文" }', '{ key: "vi-zh", label: "Tiếng Việt → Tiếng Trung" }'),
          ('aria-label="Daily Reading sections"', 'aria-label="Các phần của bài đọc hằng ngày"'),
          ('← Daily Reading', '← Danh sách bài hằng ngày'),
          ('Bài Daily Reading này chưa có đủ đoạn song ngữ để luyện dịch.', 'Bài này chưa có đủ đoạn song ngữ để luyện dịch.'),
          ('Không tìm thấy bài Daily Reading trong static package.', 'Không tìm thấy bài đọc hằng ngày trong dữ liệu hiện có.'),
          ('Bài Daily này chưa có từ vựng trong static package.', 'Bài này chưa có từ vựng trong dữ liệu hiện có.'),
          ('Bài Daily này chưa có ngữ pháp trong static package.', 'Bài này chưa có mục ngữ pháp riêng.'),
          ('"Nội dung static đã được review trước khi đóng gói."', '"Nội dung đã được rà soát trước khi đưa vào thư viện."'),
          ('"Hanzi Studio static source"', '"Nguồn Hanzi Studio"'),
      ])

      header_start = '   <div className="flex min-w-0 items-start gap-3">\n'
      header_end = '   {requestedDocumentId.length === 0 ? (\n'
      text = daily.read_text()
      a = text.find(header_start)
      b = text.find(header_end, a)
      if a < 0 or b < 0:
          raise SystemExit("daily header marker missing")
      header = text[a:b]
      wrapped = '   {requestedDocumentId.length === 0 ? (\n' + header.replace('   <div', '    <div', 1).replace('\n   </div>\n', '\n    </div>\n', 1) + '   ) : null}\n\n'
      daily.write_text(text[:a] + wrapped + text[b:])

      replace_between(
          daily,
          '     <Card variant="section" padding="md" className="grid gap-3">\n      <Button\n',
          '     <Tabs\n',
          '''     <div className="grid gap-3 border-b border-border-default pb-4 sm:pb-5">\n      <Button type="button" variant="ghost" size="sm" className="w-fit" onClick={() => setQuery({})}>\n       ← Danh sách bài hằng ngày\n      </Button>\n      <div className="flex min-w-0 flex-wrap items-start justify-between gap-3">\n       <div className="grid min-w-0 gap-1">\n        <div className="flex flex-wrap gap-2">\n         {metadataString(resource, "level") ? <Badge variant="warning" casing="natural">{metadataString(resource, "level")}</Badge> : null}\n         {metadataString(resource, "topic") ? <Badge variant="info" casing="natural">{metadataString(resource, "topic")}</Badge> : null}\n        </div>\n        <HanziText as="h2" size="card" className="text-2xl sm:text-3xl" weight="black">\n         {resource.document.title_zh}\n        </HanziText>\n        <Typography variant="bodySmall" tone="muted">\n         {resource.document.title_pinyin ? <PinyinText as="span" variant="caption" tone="accent">{resource.document.title_pinyin}</PinyinText> : null}\n         {resource.document.title_pinyin ? " · " : ""}\n         {resource.document.title_vi}\n        </Typography>\n       </div>\n       <div className="flex flex-wrap justify-end gap-2">\n        {metadataString(resource, "published_date") ? <Badge>{metadataString(resource, "published_date")}</Badge> : null}\n        {metadataNumber(resource, "estimated_minutes") ? <Badge>{metadataNumber(resource, "estimated_minutes")} phút</Badge> : null}\n       </div>\n      </div>\n     </div>\n\n''',
      )

      workspace = Path("src/features/hanzihome/reader/ReaderWorkspace.tsx")
      replace_all(workspace, [
          ('label: "今日阅读 · Bài đọc hôm nay"', 'label: "Bài đọc hôm nay"'),
          ('title: "今日阅读 · Bài đọc hôm nay"', 'title: "Bài đọc hôm nay"'),
          ('title: "TTS Studio"', 'title: "Tạo giọng đọc"'),
          ('"Learning Loop"', '"Ôn tập"'),
      ])
      PY
   - run: npm run format
   - run: npm run check
   - name: Commit verified UI changes
     run: |
      if git diff --quiet; then
       exit 0
      fi
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add src/features/hanzihome/reader/ReaderDocumentStudy.tsx src/features/hanzihome/reader/DailyReadingWorkspace.tsx src/features/hanzihome/reader/ReaderWorkspace.tsx
      git commit -m "refactor(ui): align reader surfaces with Hanzi Studio [ui-audit]"
      git push origin HEAD:audit/hanzi-ui-parity
