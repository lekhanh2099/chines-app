name: Format unified reader

on:
  push:
    branches:
      - refactor/unified-reader-2026-08-18

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/unified-reader-2026-08-18
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
        env:
          HUSKY: 0
      - name: Format unified reader files
        run: |
          npx oxfmt --write \
            src/features/hanzihome/components/lesson-text/LessonTextInlineEditor.tsx \
            src/features/hanzihome/reader/adapters/lesson-text.adapter.ts \
            src/features/hanzihome/reader/adapters/reader-resource.adapter.ts \
            src/features/hanzihome/reader/components/ReaderSurface.tsx \
            src/features/hanzihome/reader/model/reader-document.types.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/features/hanzihome/components/lesson-text/LessonTextInlineEditor.tsx \
            src/features/hanzihome/reader/adapters/lesson-text.adapter.ts \
            src/features/hanzihome/reader/adapters/reader-resource.adapter.ts \
            src/features/hanzihome/reader/components/ReaderSurface.tsx \
            src/features/hanzihome/reader/model/reader-document.types.ts
          git commit -m "format(reader): apply oxfmt"
          git push origin HEAD:refactor/unified-reader-2026-08-18
