name: Hanzi import source data

on:
 push:
  branches: [migration/hanzi-consolidation]

permissions:
 contents: write

jobs:
 import-source-data:
  if: ${{ !contains(github.event.head_commit.message, '[source-data-import]') }}
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - name: Checkout target
     uses: actions/checkout@v5
     with:
      ref: migration/hanzi-consolidation
      path: target
   - name: Checkout frozen Hanzi Studio source
     uses: actions/checkout@v5
     with:
      repository: lekhanh2099/hanzi-studio
      ref: 0568e6cd15d868ac968dfe03533d99429a4e9fcf
      path: source
      token: ${{ github.token }}
   - name: Copy non-binary migration data
     shell: bash
     run: |
      set -euo pipefail
      cd target
      rm -rf data/migrations/hanzi-studio/source-data
      mkdir -p data/migrations/hanzi-studio/source-data
      cd ../source
      while IFS= read -r file; do
        destination="../target/data/migrations/hanzi-studio/source-data/$file"
        mkdir -p "$(dirname "$destination")"
        cp "$file" "$destination"
      done < <(
        {
          find src/features -type f \( -name '*.json' -o -name '*.csv' \) -print
          find src/modules -type f \( -name '*.json' -o -name '*.csv' \) -print
        } | LC_ALL=C sort -u
      )
      cd ../target
      find data/migrations/hanzi-studio/source-data -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > data/migrations/hanzi-studio/source-data.sha256
      printf '%s\n' '0568e6cd15d868ac968dfe03533d99429a4e9fcf' > data/migrations/hanzi-studio/source-commit.txt
   - name: Commit source data snapshot
     working-directory: target
     run: |
      git add data/migrations/hanzi-studio
      if git diff --cached --quiet; then
        exit 0
      fi
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git commit -m "chore(hanzihome): snapshot frozen source data [source-data-import]"
      git push origin HEAD:migration/hanzi-consolidation
