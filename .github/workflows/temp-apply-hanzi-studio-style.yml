          hanzihome_agents.write_text(agent_text)

          theme_meta_path = Path("src/components/layout/theme-contract.ts")
          theme_meta = theme_meta_path.read_text()
          theme_meta = theme_meta.replace('label: "Chàm biên tập"', 'label: "Chàm Hanzi Studio"')
          theme_meta = theme_meta.replace('description: "Chàm rõ, nghiêm túc; canvas và Card phớt lạnh nhẹ cho nội dung dài."', 'description: "Chàm lạnh, mặt giấy sáng và nhấn indigo theo Editorial Study Workspace."')
          theme_meta = theme_meta.replace('label: "Trung tính ấm"', 'label: "Sepia ấm"')
          theme_meta = theme_meta.replace('description: "Cam nâu tiết chế; canvas và Card ấm nhẹ, hợp với phiên đọc lâu."', 'description: "Palette sepia của Hanzi Studio; ấm vừa đủ cho phiên đọc dài, vẫn giữ phân cấp rõ."')
          theme_meta_path.write_text(theme_meta)

          # ------------------------------------------------------------------
          # 5. Strengthen the existing UI guard; no new checker/script dialect.
          # ------------------------------------------------------------------
          check_path = Path("scripts/check-ui-standards.mjs")
          check = check_path.read_text()
          const_marker = 'const FEATURE_SURFACE_ESCAPE_HATCH_PATTERN =\n /\\b(?:app-glass-surface|app-gradient-hero|backdrop-blur(?:-[\\w-]+)?|shadow-theme-lg)\\b/;\n'
          extra_consts = '''const SOURCE_INTRINSIC_FIT_PATTERN = /\\b(?:w-fit|h-fit|min-w-fit|max-w-fit|min-h-fit|max-h-fit)\\b/;\nconst SOURCE_PIXEL_FONT_PATTERN = /\\btext-\\[[0-9.]+px\\]/;\nconst SOURCE_RAW_PALETTE_PATTERN =\n /\\b(?:bg|text|border|ring|outline|fill|stroke)-(?:white|black|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|fuchsia|pink|rose)(?:-|\\b)/;\nconst SOURCE_DECORATIVE_GRADIENT_PATTERN = /\\b(?:bg-gradient|bg-linear|bg-radial|bg-conic)(?:-|\\b)/;\n'''
          if 'SOURCE_INTRINSIC_FIT_PATTERN' not in check:
              check = replace_once(check, const_marker, const_marker + extra_consts, "UI guard source constants")

          inspect_marker = '  if (FEATURE_SURFACE_ESCAPE_HATCH_PATTERN.test(classNameSource)) {\n   failures.push(`featureSurfaceEscapeHatch: ${location(sourceFile, className)}`);\n  }\n'
          inspect_add = '''  if (SOURCE_INTRINSIC_FIT_PATTERN.test(classNameSource)) {\n   failures.push(`sourceFitLayoutPatch: ${location(sourceFile, className)}`);\n  }\n  if (SOURCE_PIXEL_FONT_PATTERN.test(classNameSource)) {\n   failures.push(`sourcePixelFontSize: ${location(sourceFile, className)}`);\n  }\n  if (SOURCE_RAW_PALETTE_PATTERN.test(classNameSource)) {\n   failures.push(`sourceRawPaletteUtility: ${location(sourceFile, className)}`);\n  }\n  if (SOURCE_DECORATIVE_GRADIENT_PATTERN.test(classNameSource)) {\n   failures.push(`sourceDecorativeGradient: ${location(sourceFile, className)}`);\n  }\n'''
          if 'sourceFitLayoutPatch' not in check:
              check = replace_once(check, inspect_marker, inspect_marker + inspect_add, "UI guard source inspection")

          run_marker = 'export function runUiCheck() {\n const failures = [];\n\n'
          css_guard = ''' const themeCssFiles = [\n  "src/app/globals.css",\n  "src/app/theme-palettes.css",\n  "src/app/surface-system.css",\n ];\n const themePercentageColorPattern = /(?:color-mix\\([^\\n]*%|hsla?\\([^\\n]*%)/;\n const pixelFontDeclarationPattern = /font-size:\\s*[0-9.]+px/;\n const decorativeCssGradientPattern = /(?:linear-gradient|radial-gradient|conic-gradient)\\(/;\n for (const relativePath of themeCssFiles) {\n  const absolutePath = path.join(ROOT, relativePath);\n  const lines = fs.readFileSync(absolutePath, "utf8").split("\\n");\n  lines.forEach((line, index) => {\n   if (themePercentageColorPattern.test(line)) {\n    failures.push(`themePercentageColor: ${relativePath}:${index + 1}`);\n   }\n   if (pixelFontDeclarationPattern.test(line)) {\n    failures.push(`sourcePixelFontDeclaration: ${relativePath}:${index + 1}`);\n   }\n   if (decorativeCssGradientPattern.test(line)) {\n    failures.push(`sourceDecorativeCssGradient: ${relativePath}:${index + 1}`);\n   }\n  });\n }\n\n'''
          if 'themePercentageColorPattern' not in check:
              check = replace_once(check, run_marker, run_marker + css_guard, "UI guard CSS audit")
          check_path.write_text(check)

          # Final static hard-style sanity scan before formatter/checker.
          forbidden_fit = re.compile(r'\\b(?:w-fit|h-fit|min-w-fit|max-w-fit|min-h-fit|max-h-fit)\\b')
          pixel_font = re.compile(r'(?:text-\\[[0-9.]+px\\]|font-size:\\s*[0-9.]+px)')
          raw_palette = re.compile(r'\\b(?:bg|text|border|ring|outline|fill|stroke)-(?:white|black|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|fuchsia|pink|rose)(?:-|\\b)')
          violations = []
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.css'}:
                  continue
              text = path.read_text(errors='ignore')
              if path.suffix in {'.ts', '.tsx'} and '/components/ui/' not in f'/{path.as_posix()}/':
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if forbidden_fit.search(line): violations.append(f'fit {path}:{line_no}')
                      if pixel_font.search(line): violations.append(f'px-font {path}:{line_no}')
                      if raw_palette.search(line): violations.append(f'raw-palette {path}:{line_no}')
          for path in [Path('src/app/globals.css'), Path('src/app/theme-palettes.css'), Path('src/app/surface-system.css')]:
              for line_no, line in enumerate(path.read_text().splitlines(), 1):
                  if re.search(r'(?:color-mix\\([^\\n]*%|hsla?\\([^\\n]*%)', line):
                      violations.append(f'theme-percent {path}:{line_no}')
                  if re.search(r'font-size:\\s*[0-9.]+px', line):
                      violations.append(f'px-font {path}:{line_no}')
                  if re.search(r'(?:linear-gradient|radial-gradient|conic-gradient)\\(', line):
                      violations.append(f'gradient {path}:{line_no}')
          if violations:
              raise SystemExit('Editorial Study Workspace violations remain:\\n' + '\\n'.join(violations[:200]))
