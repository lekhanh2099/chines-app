           --exercise-answer-hover-bg: var(--theme-surface-hover);
           --exercise-answer-border: var(--theme-border-strong);

           --shadow-sm: 0 0.0625rem 0.125rem oklch(0.3 0.08 260 / 0.12);
           --shadow-md: 0 0.5rem 1.5rem oklch(0.3 0.08 260 / 0.08);
           --shadow-lg: 0 0.875rem 2.5rem oklch(0.3 0.08 260 / 0.16);
           --overlay: var(--theme-overlay);
           --bg-inverse: var(--theme-inverse-surface);

           --space-1: 0.25rem;
           --space-2: 0.5rem;
           --space-3: 0.75rem;
           --space-4: 1rem;
           --space-5: 1.25rem;
           --space-6: 1.5rem;
