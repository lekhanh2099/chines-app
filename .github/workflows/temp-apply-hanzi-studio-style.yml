          # ------------------------------------------------------------------
          # 3. Whole-app hard-style audit fixes.
          # ------------------------------------------------------------------
          direct_replacements = {
              Path("src/components/layout/AppLogoMark.tsx"): [('text-white', 'text-primary-foreground')],
              Path("src/components/editor/nodes/InlineNoteNode.tsx"): [('text-sky-600', 'text-info-text')],
