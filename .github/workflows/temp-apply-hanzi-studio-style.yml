           --sidebar-width: 15rem;
           --filter-width: 17.5rem;
           --bottom-nav-height: 4.5rem;
           --topbar-height: 4rem;
           --hanzihome-command-header-height: 3rem;
           --border-thin: 0.0625rem;
          }

          [data-theme="dark"],
          .dark {
           color-scheme: dark;
           --theme-background: oklch(0.17 0.035 264);
           --theme-surface: oklch(0.215 0.04 264);
           --theme-surface-raised: oklch(0.245 0.044 264);
           --theme-surface-muted: oklch(0.275 0.047 264);
           --theme-surface-hover: oklch(0.315 0.055 264);
           --theme-reading-canvas: oklch(0.205 0.034 264);
           --theme-reading-foreground: oklch(0.97 0.009 255);
           --theme-reading-muted: oklch(0.75 0.03 255);
           --theme-foreground: oklch(0.95 0.012 255);
           --theme-foreground-muted: oklch(0.77 0.03 255);
           --theme-foreground-subtle: oklch(0.66 0.035 255);
           --theme-border: oklch(0.36 0.055 264);
           --theme-border-strong: oklch(0.49 0.075 260);
           --theme-primary: oklch(0.72 0.17 258);
           --theme-primary-hover: oklch(0.78 0.145 258);
           --theme-primary-foreground: oklch(0.17 0.045 264);
           --theme-primary-soft: oklch(0.31 0.095 258);
           --theme-success: oklch(0.72 0.13 161);
           --theme-success-soft: oklch(0.29 0.06 161);
           --theme-warning: oklch(0.78 0.14 78);
           --theme-warning-soft: oklch(0.31 0.07 78);
           --theme-danger: oklch(0.72 0.18 27);
           --theme-danger-soft: oklch(0.31 0.08 27);
           --theme-accent: oklch(0.74 0.14 188);
           --theme-accent-soft: oklch(0.3 0.075 188);
           --theme-overlay: oklch(0.07 0.02 264 / 0.74);
           --theme-scrollbar-thumb: oklch(0.48 0.055 264 / 0.78);
           --theme-scrollbar-thumb-hover: oklch(0.63 0.07 258 / 0.92);
           --theme-inverse-surface: oklch(0.115 0.028 264);
           --theme-inverse-surface-raised: oklch(0.17 0.035 264);
           --theme-inverse-canvas: oklch(0.075 0.022 264);
           --theme-inverse-foreground: oklch(0.97 0.008 255);
           --theme-inverse-muted: oklch(0.76 0.03 255);

           --shadow-sm: 0 0.0625rem 0.125rem oklch(0.055 0.018 264 / 0.32);
           --shadow-md: 0 0.5rem 1.5rem oklch(0.055 0.018 264 / 0.28);
           --shadow-lg: 0 0.875rem 2.5rem oklch(0.055 0.018 264 / 0.42);
          }

          '''
          globals_text = globals_text[:start] + theme_block + globals_text[end:]

          # Register the source semantic roles in Tailwind while retaining old aliases.
          marker = ' --color-bg-primary: var(--bg-primary);\n'
          additions = ''' --color-background: var(--theme-background);\n --color-surface: var(--theme-surface);\n --color-surface-raised: var(--theme-surface-raised);\n --color-surface-muted: var(--theme-surface-muted);\n --color-surface-hover: var(--theme-surface-hover);\n --color-reading-canvas: var(--theme-reading-canvas);\n --color-reading-foreground: var(--theme-reading-foreground);\n --color-reading-muted: var(--theme-reading-muted);\n --color-foreground: var(--theme-foreground);\n --color-foreground-muted: var(--theme-foreground-muted);\n --color-foreground-subtle: var(--theme-foreground-subtle);\n --color-border-strong: var(--theme-border-strong);\n --color-primary-hover: var(--theme-primary-hover);\n --color-primary-soft: var(--theme-primary-soft);\n\n'''
          globals_text = replace_once(globals_text, marker, additions + marker, "Tailwind source semantic tokens")

          # Remove decorative/global theme recipes that contradict the source contract.
          globals_text = globals_text.replace(
              'background: linear-gradient(135deg, rgb(20 184 166), rgb(117 72 246));',
              'background: var(--theme-primary);',
          )
          replacements = {
              'color-mix(in oklch, var(--primary) 30%, var(--border))': 'var(--theme-border-strong)',
              'color-mix(in oklch, var(--primary) 9%, var(--card))': 'var(--theme-primary-soft)',
              'color-mix(in srgb, currentColor 45%, transparent)': 'currentColor',
              'color-mix(in srgb, var(--accent) 15%, transparent)': 'var(--theme-primary-soft)',
              'color-mix(in srgb, var(--accent) 8%, transparent)': 'var(--theme-primary-soft)',
              'color-mix(in srgb, var(--info) 15%, transparent)': 'var(--theme-accent-soft)',
              'color-mix(in srgb, var(--accent) 25%, transparent)': 'var(--theme-primary-soft)',
              'color-mix(in oklab, var(--bg-elevated) 92%, white)': 'var(--theme-surface-raised)',
              'color-mix(in oklab, var(--ring) 24%, transparent)': 'var(--theme-primary-soft)',
              'color-mix(in oklab, var(--primary) 32%, var(--border))': 'var(--theme-border-strong)',
          }
          for old, new in replacements.items():
              globals_text = globals_text.replace(old, new)

          # Source rule: font sizes use rem/semantic scale, never px.
          px_font_replacements = {
              'font-size: 15px;': 'font-size: 0.9375rem;',
              'font-size: 14px;': 'font-size: 0.875rem;',
              'font-size: 13px;': 'font-size: 0.8125rem;',
              'font-size: 12px;': 'font-size: 0.75rem;',
              'font-size: 11px;': 'font-size: 0.6875rem;',
              'font-size: 10px;': 'font-size: 0.625rem;',
          }
          for old, new in px_font_replacements.items():
              globals_text = globals_text.replace(old, new)
          globals_path.write_text(globals_text)

          palettes = r'''/*
           * Hanzi Studio Editorial Study Workspace palettes.
           *
           * The persisted chines-app palette keys stay stable. `warm` intentionally
           * maps to Hanzi Studio's sepia palette so existing stored preferences remain valid.
           * Theme colors use numeric OKLCH channels and decimal alpha only: no HSL
           * percentages and no percentage-based color-mix recipes.
           */

          [data-theme="light"][data-palette="editorial"] {
