name: Apply Hanzi Studio editorial UI system

on:
  push:
    branches: [audit/hanzi-ui-parity]

permissions:
  contents: write

concurrency:
  group: apply-hanzi-studio-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hanzi-style-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HUSKY: 0
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/hanzi-ui-parity
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply Editorial Study Workspace contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing marker for {label}: {old[:180]!r}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1. Canonical theme foundations — ported from Hanzi Studio 1.5.0.
          #    Preserve chines-app token/API ownership while using source values.
          # ------------------------------------------------------------------
          globals_path = Path("src/app/globals.css")
          globals_text = globals_path.read_text()
          start = globals_text.index(':root,\n[data-theme="light"] {')
          end = globals_text.index('/* Tailwind v4 Token Registration */')
          theme_block = r''':root,
          [data-theme="light"] {
           color-scheme: light;
           --theme-background: oklch(0.978 0.014 255);
           --theme-surface: oklch(0.998 0.003 255);
           --theme-surface-raised: oklch(0.992 0.007 255);
           --theme-surface-muted: oklch(0.958 0.022 255);
           --theme-surface-hover: oklch(0.935 0.034 255);
           --theme-reading-canvas: oklch(0.997 0.004 92);
           --theme-reading-foreground: oklch(0.185 0.027 264);
           --theme-reading-muted: oklch(0.43 0.035 263);
           --theme-foreground: oklch(0.235 0.035 264);
           --theme-foreground-muted: oklch(0.46 0.038 263);
           --theme-foreground-subtle: oklch(0.59 0.035 261);
           --theme-border: oklch(0.875 0.029 258);
           --theme-border-strong: oklch(0.73 0.055 258);
           --theme-primary: oklch(0.565 0.205 258);
           --theme-primary-hover: oklch(0.505 0.225 258);
           --theme-primary-foreground: oklch(0.99 0.004 255);
           --theme-primary-soft: oklch(0.928 0.055 258);
           --theme-success: oklch(0.52 0.13 161);
           --theme-success-soft: oklch(0.94 0.045 161);
           --theme-warning: oklch(0.64 0.145 78);
           --theme-warning-soft: oklch(0.95 0.055 80);
           --theme-danger: oklch(0.56 0.205 27);
           --theme-danger-soft: oklch(0.94 0.055 27);
           --theme-accent: oklch(0.58 0.155 188);
           --theme-accent-soft: oklch(0.93 0.052 188);
           --theme-overlay: oklch(0.17 0.04 264 / 0.48);
           --theme-scrollbar-thumb: oklch(0.66 0.055 258 / 0.62);
           --theme-scrollbar-thumb-hover: oklch(0.53 0.085 258 / 0.82);
           --theme-inverse-surface: oklch(0.22 0.045 264);
           --theme-inverse-surface-raised: oklch(0.27 0.05 264);
           --theme-inverse-canvas: oklch(0.15 0.038 264);
           --theme-inverse-foreground: oklch(0.96 0.012 255);
           --theme-inverse-muted: oklch(0.76 0.03 255);

           --background: var(--theme-background);
