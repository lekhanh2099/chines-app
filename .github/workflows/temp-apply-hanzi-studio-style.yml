          ]
          for root in application_roots:
              for path in root.rglob("*.tsx"):
                  text = path.read_text()
                  original = text
                  text = text.replace("grid w-fit", "inline-grid")
                  text = text.replace("flex w-fit", "inline-flex")
                  text = text.replace("max-h-fit ", "")
                  text = text.replace(" max-h-fit", "")
                  text = re.sub(r'(?<![\w-])w-fit(?![\w-])', 'justify-self-start', text)
                  text = re.sub(r'(?<![\w-])h-fit(?![\w-])', 'self-start', text)
                  if text != original:
                      path.write_text(text)

          # Primitive owners express content sizing structurally, not through fit utilities.
          primitive_fit_replacements = {
              Path("src/components/ui/field.tsx"): [
                  ("flex w-fit gap-2", "inline-flex gap-2"),
                  ("flex w-fit items-center", "inline-flex items-center"),
                  ("block w-fit bg-background", "inline-block bg-background"),
