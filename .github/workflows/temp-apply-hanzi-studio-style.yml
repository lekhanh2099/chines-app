           --popover: var(--theme-surface-raised);
           --popover-foreground: var(--theme-foreground);
           --primary: var(--theme-primary);
           --primary-foreground: var(--theme-primary-foreground);
           --secondary: var(--theme-surface-muted);
           --secondary-foreground: var(--theme-foreground);
           --muted: var(--theme-surface-muted);
           --muted-foreground: var(--theme-foreground-muted);
           --accent: var(--theme-primary-soft);
           --accent-foreground: var(--theme-primary);
           --destructive: var(--theme-danger);
           --border: var(--theme-border);
           --input: var(--theme-border);
