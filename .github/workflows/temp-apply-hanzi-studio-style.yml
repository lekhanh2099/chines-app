           --sidebar-primary-foreground: var(--theme-primary-foreground);
           --sidebar-accent: var(--theme-primary-soft);
           --sidebar-accent-foreground: var(--theme-primary);
           --sidebar-border: var(--theme-border);
           --sidebar-ring: var(--theme-primary);

           --bg-primary: var(--theme-background);
           --bg-card: var(--theme-surface);
           --bg-card-hover: var(--theme-surface-hover);
           --bg-elevated: var(--theme-surface-raised);
           --bg-input: var(--theme-surface);
           --bg-subtle: var(--theme-surface-muted);
           --text-primary: var(--theme-foreground);
           --text-secondary: var(--theme-foreground-muted);
           --text-muted: var(--theme-foreground-subtle);
           --text-inverse: var(--theme-primary-foreground);
           --accent-hover: var(--theme-primary-hover);
           --accent-subtle: var(--theme-primary-soft);
           --accent-muted: var(--theme-primary-soft);
           --accent-text: var(--theme-primary);
           --warning: var(--theme-warning);
           --warning-subtle: var(--theme-warning-soft);
           --warning-text: var(--theme-warning);
           --success: var(--theme-success);
           --success-subtle: var(--theme-success-soft);
           --success-text: var(--theme-success);
           --danger: var(--theme-danger);
           --danger-subtle: var(--theme-danger-soft);
           --danger-text: var(--theme-danger);
           --info: var(--theme-accent);
           --info-subtle: var(--theme-accent-soft);
           --info-text: var(--theme-accent);
           --purple: var(--theme-accent);
           --purple-subtle: var(--theme-accent-soft);
           --purple-text: var(--theme-accent);
           --border-hover: var(--theme-border-strong);

           --study-surface: var(--theme-surface);
           --study-surface-muted: var(--theme-surface-muted);
           --study-chip-bg: var(--theme-surface-muted);
           --study-chip-accent-bg: var(--theme-primary-soft);
           --study-accent-border: var(--theme-border-strong);
           --exercise-card-bg: var(--theme-surface);
           --exercise-question-bg: var(--theme-surface-muted);
