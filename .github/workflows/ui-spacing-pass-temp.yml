name: Temporary spacing normalization pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ui-spacing-pass-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --global npm@11.6.1
      - run: npm ci

      - name: Normalize audited component spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old!r}")
              file.write_text(text.replace(old, new))

          # Login: parent-owned rhythm instead of stacked child margins.
          p = "src/app/login/page.tsx"
          replace(p,
              'className="flex min-h-dvh flex-col justify-center bg-bg-primary px-4 py-[max(3rem,env(safe-area-inset-top))] sm:px-6 lg:px-8"',
              'className="flex min-h-dvh flex-col justify-center gap-8 bg-bg-primary px-4 py-[max(3rem,env(safe-area-inset-top))] sm:px-6 lg:px-8"')
          replace(p, 'className="flex flex-col items-center sm:mx-auto sm:w-full sm:max-w-md"',
                     'className="grid justify-items-center gap-2 sm:mx-auto sm:w-full sm:max-w-md"')
          replace(p, 'className="app-brand-gradient mb-5 grid size-12 place-items-center rounded-2xl shadow-theme-sm"',
                     'className="app-brand-gradient grid size-12 place-items-center rounded-xl shadow-theme-sm"')
          replace(p, 'className="mt-2 max-w-sm"', 'className="max-w-sm"')
          replace(p, 'className="mt-8 sm:mx-auto sm:w-full sm:max-w-md"',
                     'className="sm:mx-auto sm:w-full sm:max-w-md"')
          replace(p, 'className="border border-border-default bg-bg-card px-4 py-8 sm:rounded-xl sm:px-10"',
                     'className="grid gap-6 border border-border-default bg-bg-card px-4 py-8 sm:rounded-xl sm:px-10"')
          replace(p, 'className="mb-6 w-full"', 'className="w-full"')
          replace(p, 'className="mb-6 flex items-center gap-3 text-xs text-text-muted"',
                     'className="flex items-center gap-3 text-xs text-text-muted"')
          replace(p, 'className="w-full mt-2"', 'className="w-full"')
          replace(p, 'className="mt-6 flex flex-col gap-2 border-t border-border-default pt-6 text-center text-text-muted"',
                     'className="flex flex-col gap-2 border-t border-border-default pt-6 text-center text-text-muted"')

          # Notes editor: separators use internal padding; editor gutter is container padding.
          p = "src/components/notes/NoteEditorPanel.tsx"
          replace(p, 'className="my-1 h-px bg-border-default"',
                     'className="h-3 py-1 before:block before:h-px before:bg-border-default"')
          replace(p, 'className="note-editor-split-panel m-1 min-h-0 flex-1 overflow-hidden sm:m-2 lg:m-4"',
                     'className="note-editor-split-panel min-h-0 flex-1 overflow-hidden p-1 sm:p-2 lg:p-4"')
          replace(p, 'className="note-editor-scroll m-1 sm:m-2 lg:m-4"',
                     'className="note-editor-scroll p-1 sm:p-2 lg:p-4"')

          p = "src/components/notes/NoteTabContainer.tsx"
          replace(p, 'className="flex h-full flex-col items-center justify-center bg-bg-primary text-text-muted"',
                     'className="flex h-full flex-col items-center justify-center gap-3 bg-bg-primary text-text-muted"')
          replace(p, 'className="w-10 h-10 mb-3 opacity-40"', 'className="size-10 opacity-40"')

          # Vocabulary drawer.
          p = "src/components/vocabulary/VocabDetailDrawer.tsx"
          replace(p, '<div className="border-b border-border-default px-4 py-3 sm:px-5">\n    <div className="min-w-0">',
                     '<div className="border-b border-border-default px-4 py-3 sm:px-5">\n    <div className="grid min-w-0 gap-1">')
          replace(p, 'className="mt-1">\n       {smartData.entry.pinyin}', '>\n       {smartData.entry.pinyin}')
          replace(p, '<Card variant="subtle" padding="sm">\n      <Typography as="p" variant="caption" tone="warning" weight="bold">',
                     '<Card variant="subtle" padding="sm" className="grid gap-1">\n      <Typography as="p" variant="caption" tone="warning" weight="bold">')
          replace(p, 'className="mt-1" />\n     </Card>', '/>\n     </Card>')
          replace(p, '<span className="min-w-0">\n         <span className="flex flex-wrap items-center gap-2">',
                     '<span className="grid min-w-0 gap-1">\n         <span className="flex flex-wrap items-center gap-2">')
          replace(p, 'className="mt-1 block"', 'className="block"')

          # Dictionary cards and detail sections.
          p = "src/features/dictionary/DictionarySrsPage.tsx"
          replace(p, '<div className="min-w-0">\n           <LearnerHanziText',
                     '<div className="grid min-w-0 gap-1">\n           <LearnerHanziText')
          replace(p, 'className="mt-1">\n            {item.pinyin', '>\n            {item.pinyin')
          replace(p, '<Card variant="subtle" padding="sm" className="mt-1">',
                     '<Card variant="subtle" padding="sm">')

          p = "src/features/dictionary/components/DictionaryWordSections.tsx"
          replace(p, '<div className="grid gap-4">\n    <div className="min-w-0">',
                     '<div className="grid gap-4">\n    <div className="grid min-w-0 gap-2">')
          replace(p, 'className="mt-1 flex flex-wrap items-center gap-2.5"',
                     'className="flex flex-wrap items-center gap-2.5"')
          replace(p, 'className="mt-3 grid gap-2"', 'className="grid gap-2"')
          replace(p, 'className="mt-3 max-w-3xl"', 'className="max-w-3xl"')
          replace(p, 'className="mt-3"\n      >\n       {viewModel.ai.source_metadata',
                     '>\n       {viewModel.ai.source_metadata')
          replace(p, 'className="space-y-2"', 'className="grid gap-2"', 2)
          replace(p, 'className="space-y-2.5"', 'className="grid gap-2.5"')

          # Radicals.
          p = "src/features/hanzihome/components/RadicalDetailPanel.tsx"
          replace(p, '<div className="min-w-0">\n     <div className="mb-2 flex flex-wrap items-center gap-2">',
                     '<div className="grid min-w-0 gap-2">\n     <div className="flex flex-wrap items-center gap-2">')

          p = "src/features/hanzihome/components/RadicalWorkspace.tsx"
          replace(p, '<Card variant="subtle" padding="lg">\n        <StudyInstructionText',
                     '<Card variant="subtle" padding="lg" className="grid gap-1">\n        <StudyInstructionText')
          replace(p, 'className="mt-1">\n         Thử đổi số nét', '>\n         Thử đổi số nét')
          replace(p, '<div className="min-w-0">\n    <div className="flex flex-wrap items-center gap-2">',
                     '<div className="grid min-w-0 gap-2">\n    <div className="flex flex-wrap items-center gap-2">')
          replace(p, 'className="mt-1"\n    >\n     {radical.coreMeaning', '>\n     {radical.coreMeaning')
          replace(p, 'className="mt-3">\n     #{radical.index}', '>\n     #{radical.index}')

          p = "src/features/hanzihome/components/VocabWritingCue.tsx"
          replace(p,
              'className={\n    !isShowAll\n     ? [\n        compact\n         ? "rounded-2xl border border-border-default bg-bg-primary p-4 shadow-theme-sm"\n         : "rounded-xl bg-bg-primary p-3 shadow-theme-sm sm:p-4",\n        className,\n       ].join(" ")\n     : className\n   }',
              'className={[\n    "grid gap-2",\n    !isShowAll\n     ? compact\n       ? "rounded-xl border border-border-default bg-bg-primary p-4 shadow-theme-sm"\n       : "rounded-xl bg-bg-primary p-3 shadow-theme-sm sm:p-4"\n     : "",\n    className,\n   ].join(" ")}')
          replace(p, '"relative mt-2 grid gap-4 md:items-start",',
                     '"relative grid gap-4 md:items-start",')

          # Compact lesson preview.
          p = "src/features/hanzihome/components/aggregate-library/LessonContentPreviewPanel.tsx"
          replace(p, 'className="rounded-xl bg-bg-subtle px-3 py-2"',
                     'className="grid gap-1 rounded-xl bg-bg-subtle px-3 py-2"')
          replace(p, 'className="mr-2 rounded-full bg-bg-card px-2 py-0.5"',
                     'className="w-fit rounded-full bg-bg-card px-2 py-0.5"')

          p = "src/features/hanzihome/components/grammar/StructuredGrammarContent.tsx"
          replace(p, '<section className="rounded-xl border border-primary/20 bg-primary/8 p-4 shadow-theme-sm">',
                     '<section className="grid gap-3 rounded-xl border border-primary/20 bg-primary/8 p-4 shadow-theme-sm">')
          replace(p, 'className="mt-3"\n     />', '/>')

          p = "src/features/hanzihome/components/lesson-overview/LessonModuleSidebarItem.tsx"
          replace(p, '<span className="min-w-0 flex-1">', '<span className="grid min-w-0 flex-1 gap-0.5">')
          replace(p, 'className="mt-0.5 block opacity-80"', 'className="block opacity-80"')

          # Reader settings: Card owns vertical rhythm; children do not push siblings.
          p = "src/features/hanzihome/components/lesson-overview/LessonReadingSettings.tsx"
          replace(p, '<Card variant="section" padding="lg">\n    <SettingsGroup',
                     '<Card variant="section" padding="lg" className="grid gap-5">\n    <SettingsGroup', 1)
          replace(p, '<Separator className="my-5" />', '<Separator />', 4)
          replace(p, '<div className="min-w-0">\n          <Typography as="p" variant="label"',
                     '<div className="grid min-w-0 gap-0.5">\n          <Typography as="p" variant="label"')
          replace(p, 'className="mt-0.5">\n           {disabled', '>\n           {disabled')
          replace(p, '<Card variant="section" padding="lg" className="md:sticky md:top-4">',
                     '<Card variant="section" padding="lg" className="grid gap-5 md:sticky md:top-4">')
          replace(p, '<div>\n     <Typography as="h3" variant="sectionTitle"',
                     '<div className="grid gap-1">\n     <Typography as="h3" variant="sectionTitle"', 1)
          replace(p, 'className="mt-1">\n      Đây là cách nội dung học', '>\n      Đây là cách nội dung học')
          replace(p, '<div className="mt-5">\n    <StudyInstructionText',
                     '<div className="grid gap-3">\n    <StudyInstructionText')
          replace(p, '<div className="mt-3">\n     <ProgressiveStudyText',
                     '<div>\n     <ProgressiveStudyText')
          replace(p, '<div>\n    <StudyInstructionText\n     variant="overline"',
                     '<div className="grid gap-2">\n    <StudyInstructionText\n     variant="overline"', 1)
          replace(p, 'className="mt-2">\n     Hoàn thành câu', '>\n     Hoàn thành câu')
          replace(p, 'className="mt-2 block">\n     我___', 'className="block">\n     我___')
          replace(p, 'className="mt-2">\n      Đáp án hiển thị', '>\n      Đáp án hiển thị')
          replace(p, 'className="mt-2">\n      Đáp án đang ẩn', '>\n      Đáp án đang ẩn')

          p = "src/features/hanzihome/components/lesson-overview/book-section/ProperNounCard.tsx"
          replace(p, '<details>\n       <summary', '<details className="grid gap-2">\n       <summary')
          replace(p, 'className="mt-2 flex flex-wrap gap-2"', 'className="flex flex-wrap gap-2"')

          p = "src/features/hanzihome/components/lesson-overview/exercise-section/MatchingOptionCard.tsx"
          replace(p, 'className="study-chip-accent mt-0.5 shrink-0 rounded-md border px-2 py-0.5"',
                     'className="study-chip-accent shrink-0 translate-y-0.5 rounded-md border px-2 py-0.5"')

          # Course/library hierarchy.
          p = "src/features/hanzihome/components/library/CourseCollectionSection.tsx"
          replace(p, '<div className="min-w-0">\n      <div className="flex flex-wrap items-center gap-2">',
                     '<div className="grid min-w-0 gap-1">\n      <div className="flex flex-wrap items-center gap-2">', 1)
          replace(p, 'className="mt-1">\n       {group.description}', '>\n       {group.description}')
          replace(p, '<div className="min-w-0">\n           <div className="flex flex-wrap items-center gap-2">',
                     '<div className="grid min-w-0 gap-0.5">\n           <div className="flex flex-wrap items-center gap-2">')
          replace(p, 'className="mt-0.5">\n             {course.subtitle}', '>\n             {course.subtitle}')

          p = "src/features/hanzihome/components/library/RecentLearningCard.tsx"
          replace(p, '<div className="min-w-0 flex-1">', '<div className="grid min-w-0 flex-1 gap-1">')
          replace(p, 'className="mt-1">\n      Bài {lesson.lessonNumber}', '>\n      Bài {lesson.lessonNumber}')
          replace(p, 'className="mt-0.5">\n      {course.title}', '>\n      {course.title}')

          p = "src/features/hanzihome/components/review/StudyReviewBack.tsx"
          replace(p, '<kbd className="ml-2 rounded bg-bg-subtle px-1.5 py-0.5 text-[0.65rem] font-black text-text-muted">',
                     '<kbd className="rounded-md bg-bg-subtle px-1.5 py-0.5 text-[0.65rem] font-black text-text-muted">')

          p = "src/features/hanzihome/components/vocab-detail/VocabReadingSection.tsx"
          replace(p, 'className="group rounded-2xl border border-border-default bg-bg-card p-4 shadow-theme-sm"',
                     'className="group grid gap-3 rounded-xl border border-border-default bg-bg-card p-4 shadow-theme-sm"')
          replace(p, 'className="mt-3 grid gap-3 text-base leading-relaxed text-text-secondary"',
                     'className="grid gap-3 text-base leading-relaxed text-text-secondary"')

          # Listening.
          p = "src/features/hanzihome/listening/ListeningDictationWorkspace.tsx"
          replace(p, '<div className="text-center">\n     <StudyInstructionText tone="default" weight="black">\n      Không tải được bài nghe chép',
                     '<div className="grid gap-1 text-center">\n     <StudyInstructionText tone="default" weight="black">\n      Không tải được bài nghe chép')
          replace(p, 'className="mt-1">\n      {query.error', '>\n      {query.error')
          replace(p, '<Headphones className="mt-0.5 size-5 shrink-0 text-primary" />',
                     '<Headphones className="size-5 shrink-0 translate-y-0.5 text-primary" />')
          replace(p, '<div className="min-w-0">\n       <Badge variant="purple" className="mb-1 w-fit">',
                     '<div className="grid min-w-0 gap-1">\n       <Badge variant="purple" className="w-fit">')
          replace(p, '<div className="text-center">\n       <StudyInstructionText tone="default" weight="black">\n        Phần này chưa có script',
                     '<div className="grid gap-1 text-center">\n       <StudyInstructionText tone="default" weight="black">\n        Phần này chưa có script')
          replace(p, 'className="mt-1">\n        Chọn đề mục khác', '>\n        Chọn đề mục khác')

          p = "src/features/hanzihome/listening/ListeningTranscriptBlock.tsx"
          replace(p, '<div>\n        <Badge', '<div className="grid gap-1">\n        <Badge', 1)
          replace(p, 'className="mt-1 block">\n          {speaker.labelVi}', 'className="block">\n          {speaker.labelVi}')

          # Memory tips.
          p = "src/features/hanzihome/memory-tips/GlobalMemoryTipCard.tsx"
          replace(p, '<div className="min-w-0">\n       <StudyInstructionText',
                     '<div className="grid min-w-0 gap-1">\n       <StudyInstructionText', 1)
          replace(p, 'className="mt-1"\n       >\n        Thêm tip ngắn', '>\n        Thêm tip ngắn')

          p = "src/features/hanzihome/memory-tips/HanziHomeMemoryTipsPage.tsx"
          replace(p, '<div className="min-w-0 flex-1">\n     <div className="mb-2 flex flex-wrap items-center gap-2">',
                     '<div className="grid min-w-0 flex-1 gap-1">\n     <div className="flex flex-wrap items-center gap-2">')
          replace(p, 'className="mt-1">\n      {tip.body}', '>\n      {tip.body}')

          # Search.
          p = "src/features/hanzihome/search/GlobalSearchDialog.tsx"
          replace(p, 'className="min-h-0 flex-1 overscroll-contain overflow-y-auto px-2 py-2 scrollbar-soft"',
                     'className="grid min-h-0 flex-1 content-start gap-1 overscroll-contain overflow-y-auto px-2 py-2 scrollbar-soft"')
          replace(p, 'className="mb-1 flex w-full"', 'className="flex w-full"')

          p = "src/features/hanzihome/search/SearchResultItem.tsx"
          replace(p, '<span className="min-w-0">\n    <span className="flex min-w-0 items-center gap-2">',
                     '<span className="grid min-w-0 gap-0.5">\n    <span className="flex min-w-0 items-center gap-2">')
          replace(p, 'className="mt-0.5 block"', 'className="block"')

          # Notebook.
          p = "src/features/notebook/NotebookPage.tsx"
          replace(p, '<div>\n       <Typography as="h1" id="notebook-section-heading"',
                     '<div className="grid gap-1">\n       <Typography as="h1" id="notebook-section-heading"')
          replace(p, 'className="mt-1 max-w-4xl"', 'className="max-w-4xl"')

          p = "src/features/notebook/components/NotebookSectionGuide.tsx"
          replace(p, '<details className="group">', '<details className="group grid gap-3">')
          replace(p, 'className="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"',
                     'className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"')

          # Notes lists.
          p = "src/features/notes/components/NoteListRow.tsx"
          replace(p, '<IconTile tone={getContextTone(context.kind)} size="sm" className="mt-0.5">',
                     '<IconTile tone={getContextTone(context.kind)} size="sm" className="translate-y-0.5">')

          p = "src/features/notes/components/NotesLibraryNavigator.tsx"
          replace(p, 'className="ml-5 grid gap-1 border-l border-border-default pl-2"',
                     'className="relative grid gap-1 pl-7 before:absolute before:inset-y-0 before:left-5 before:w-px before:bg-border-default"')

          # Settings page.
          p = "src/features/settings/SettingsPageContent.tsx"
          replace(p, 'className="mt-4 grid gap-4"', 'className="grid gap-4 pt-4"')
          replace(p, 'className="mt-4">\n      {readingSettings}', 'className="pt-4">\n      {readingSettings}')
          replace(p, 'className="mt-4 grid gap-5"', 'className="grid gap-5 pt-4"')
          replace(p, '<div className="min-w-0 max-w-3xl">\n        <Badge variant="accent"',
                     '<div className="grid min-w-0 max-w-3xl gap-2">\n        <Badge variant="accent"')
          replace(p, 'className="mt-2">\n         Cài đặt tra cứu AI', '>\n         Cài đặt tra cứu AI')
          replace(p, 'className="mt-1">\n         Tra nhanh ưu tiên', '>\n         Tra nhanh ưu tiên')
          replace(p, '<div className="mt-3">\n         <Badge variant={hasUnsavedChanges ? "warning" : "success"} size="md">',
                     '<div>\n         <Badge variant={hasUnsavedChanges ? "warning" : "success"} size="md">')
          replace(p, '<div>\n         <Typography as="p" tone="default" weight="semibold">\n          {getGeminiModelLabel(DEFAULT_GEMINI_QUICK_MODEL)}',
                     '<div className="grid gap-1">\n         <Typography as="p" tone="default" weight="semibold">\n          {getGeminiModelLabel(DEFAULT_GEMINI_QUICK_MODEL)}')
          replace(p, 'className="mt-1">\n          Tối ưu độ trễ', '>\n          Tối ưu độ trễ')
          replace(p, 'className="space-y-4"', 'className="grid gap-4"')
          replace(p, '<div className="min-w-0">\n    <Typography as="h2" variant="sectionTitle"',
                     '<div className="grid min-w-0 gap-1">\n    <Typography as="h2" variant="sectionTitle"')
          replace(p, 'className="mt-1">\n     {description}', '>\n     {description}')
          replace(p, 'className="min-w-0 space-y-1"', 'className="grid min-w-0 gap-1"')
          replace(p, '<Card variant="default" padding="lg">\n   <div className="mb-4 flex items-start justify-between gap-4">',
                     '<Card variant="default" padding="lg" className="grid gap-4">\n   <div className="flex items-start justify-between gap-4">')
          replace(p, 'className="space-y-2"', 'className="grid gap-2"')
          replace(p, '<div className="mb-3 flex items-center justify-between">',
                     '<div className="flex items-center justify-between gap-3">')

          # API-key manager: one major Card, internal semantic surfaces, no vertical push margins.
          p = "src/components/settings/ApiKeyManagerSection.tsx"
          replace(p, 'import { Button } from "@/components/ui/button";',
                     'import { Button } from "@/components/ui/button";\nimport { Card } from "@/components/ui/card";')
          replace(p, '<section className="rounded-2xl border border-border-default bg-bg-card p-6 shadow-theme-sm">',
                     '<Card variant="section" padding="lg" className="grid gap-5">')
          replace(p, '</section>\n );\n}', '</Card>\n );\n}', 1)
          replace(p, 'className="mt-5 rounded-2xl border border-warning/30 bg-warning-subtle px-4 py-3 leading-6 text-warning-text"',
                     'className="rounded-xl border border-warning/30 bg-warning-subtle px-4 py-3 leading-6 text-warning-text"')
          replace(p, 'className="mt-5"', '', 1)
          replace(p, 'className="mt-6 flex flex-col items-start gap-3 rounded-2xl border border-danger/30 bg-danger/5 p-5 text-danger-text"',
                     'className="flex flex-col items-start gap-3 rounded-xl border border-danger/30 bg-danger/5 p-5 text-danger-text"')
          replace(p, 'className="mt-6 flex items-center gap-3 rounded-2xl border border-border-default bg-bg-primary p-5  text-text-secondary"',
                     'className="flex items-center gap-3 rounded-xl border border-border-default bg-bg-primary p-5 text-text-secondary"')
          replace(p, 'className="mt-6 flex items-center gap-3 rounded-xl border border-dashed border-border-default bg-bg-primary p-4"',
                     'className="flex items-center gap-3 rounded-xl border border-dashed border-border-default bg-bg-primary p-4"')
          replace(p, 'className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-accent-subtle text-accent-text"',
                     'className="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-accent-subtle text-accent-text"')
          replace(p, '<div>\n      <Typography as="p" tone="default" weight="semibold">\n       Chưa có API key cá nhân',
                     '<div className="grid gap-1">\n      <Typography as="p" tone="default" weight="semibold">\n       Chưa có API key cá nhân')
          replace(p, 'className="mt-1">\n       {schemaReady', '>\n       {schemaReady')
          replace(p, 'className="mt-6 divide-y divide-border-default border-y border-border-default"',
                     'className="divide-y divide-border-default border-y border-border-default"')
          replace(p, 'className="min-w-0 space-y-2"', 'className="grid min-w-0 gap-2"')
          replace(p, '<div className="min-w-0">\n           <Typography as="h3"',
                     '<div className="grid min-w-0 gap-1">\n           <Typography as="h3"')
          replace(p, 'className="mt-1">\n            {key.maskedKey}', '>\n            {key.maskedKey}')
          PY

      - run: npm run format
      - run: git checkout -- .github/workflows/ui-spacing-pass-temp.yml

      - name: Commit spacing normalization
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: normalize app spacing rhythm"
          git push origin "HEAD:${HEAD_REF}"
