name: Temporary radius normalization pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Normalize audited large radii
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              "src/features/dictionary/components/CharacterWriterCard.tsx",
              "src/features/dictionary/components/DictionarySentenceView.tsx",
              "src/features/dictionary/components/DictionarySkeletons.tsx",
              "src/features/hanzihome/components/VocabReviewSkeleton.tsx",
              "src/features/hanzihome/components/library/HanziHomeLibrarySkeleton.tsx",
              "src/features/hanzihome/components/review/LessonVocabReviewPanel.tsx",
              "src/features/hanzihome/components/vocab/VocabWorkspace.tsx",
              "src/features/hanzihome/components/vocab-detail/StructuredExamplesSection.tsx",
              "src/features/hanzihome/html-artifacts/HanziHomeHtmlArtifactsPage.tsx",
              "src/features/notebook/components/NotebookDeepDive.tsx",
              "src/features/notes/components/NoteList.tsx",
              "src/features/notes/components/NotesWorkspaceSkeleton.tsx",
          ]

          for path in paths:
              file = Path(path)
              text = file.read_text()
              count = text.count("rounded-2xl") + text.count("rounded-3xl")
              if count == 0:
                  raise SystemExit(f"{path}: expected at least one large radius")
              file.write_text(text.replace("rounded-3xl", "rounded-xl").replace("rounded-2xl", "rounded-xl"))
              print(f"{path}: normalized {count} large radius token(s)")
          PY
      - run: npm run format
      - run: git checkout -- .github/workflows/ui-radius-pass-temp.yml
      - name: Commit radius normalization
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: normalize app radius scale"
          git push origin "HEAD:${HEAD_REF}"
