name: Finalize learning parity follow-up v2

on:
 push:
  branches: [audit/hanzi-ui-parity]

permissions:
 contents: write

concurrency:
 group: finalize-learning-parity-followup-v2-${{ github.ref }}
 cancel-in-progress: true

jobs:
 finalize:
  if: ${{ !contains(github.event.head_commit.message, '[learning-parity-followup]') }}
  runs-on: ubuntu-latest
  timeout-minutes: 30
  env:
   HUSKY: 0
   NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  steps:
   - uses: actions/checkout@v5
     with:
      ref: audit/hanzi-ui-parity
      fetch-depth: 0
   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm
   - run: npm install --global npm@11.6.1
   - run: npm ci
   - name: Apply source-aligned learning UI patches
     run: |
      python - <<'PY'
      from pathlib import Path

      def replace_once(text: str, old: str, new: str, label: str) -> str:
       if old not in text:
        raise SystemExit(f"missing marker for {label}: {old[:160]!r}")
       return text.replace(old, new, 1)

      path = Path("src/features/hanzihome/reader/DailyReadingWorkspace.tsx")
      text = path.read_text()
      text = replace_once(
       text,
       'import { ReaderDocumentStudy } from "./ReaderDocumentStudy";\n',
       'import { DailyReadingGrammarPanel } from "./DailyReadingGrammarPanel";\nimport { ReaderDocumentStudy } from "./ReaderDocumentStudy";\n',
       "daily grammar import",
      )
      old = '''       {activeTab === "grammar" ? (\n        <Card variant="section" padding="md" className="grid gap-3">\n         <Typography as="h3" variant="sectionTitle" weight="black">\n          Ngữ pháp\n         </Typography>\n         {grammarItems.map((grammar) => (\n          <Card key={grammar.id} variant="default" padding="sm" className="grid gap-1">\n           <Typography variant="cardTitle" weight="black">\n            {grammar.title}\n           </Typography>\n           <Typography variant="bodySmall" tone="muted">\n            {grammar.core}\n           </Typography>\n           {grammar.examplesParsed.slice(0, 2).map((example) => (\n            <Typography key={example.id} variant="caption" lang="zh-CN">\n             {example.zh} · {example.vi}\n            </Typography>\n           ))}\n          </Card>\n         ))}\n         {grammarItems.length === 0 ? (\n          <Typography variant="bodySmall" tone="muted">\n           Bài này chưa có mục ngữ pháp riêng.\n          </Typography>\n         ) : null}\n        </Card>\n       ) : null}\n'''
      new = '''       {activeTab === "grammar" ? (\n        <DailyReadingGrammarPanel grammarItems={grammarItems} />\n       ) : null}\n'''
      text = replace_once(text, old, new, "daily grammar block")
      path.write_text(text)

      path = Path("src/features/hanzihome/reader/ReaderDocumentStudy.tsx")
      text = path.read_text()
      text = replace_once(
       text,
       'import { ReaderExercisePanel } from "./ReaderExercisePanel";\n',
       'import { ReaderExercisePanel } from "./ReaderExercisePanel";\nimport { ReaderTranslationPracticePanel } from "./ReaderTranslationPracticePanel";\n',
       "reader translation import",
      )
      start = text.find('       {showTranslationTab ? (\n')
      end = text.find('       {showDictationTab ? (\n', start)
      if start < 0 or end < 0:
       raise SystemExit("reader translation block markers not found")
      replacement = '''       {showTranslationTab ? (\n        <ReaderTranslationPracticePanel\n         activeIndex={activeIndex}\n         checked={translationIsChecked}\n         completedCount={translationSegments.filter(\n          (candidate) =>\n           translationChecked[`${candidate.id}:${translationDirection}`] === true,\n         ).length}\n         direction={translationDirection}\n         displayMode={displayMode}\n         draft={translationDraft}\n         score={translationScore}\n         segment={translationSegment}\n         segments={translationSegments}\n         onCheck={checkTranslation}\n         onDirectionChange={setTranslationDirection}\n         onDraftChange={updateTranslationDraft}\n         onNext={() => move(activeIndex + 1)}\n         onPrevious={() => move(activeIndex - 1)}\n         onSelect={(segmentId) => {\n          const paragraphIndex = paragraphs.findIndex((paragraph) => paragraph.id === segmentId);\n          if (paragraphIndex >= 0) move(paragraphIndex);\n         }}\n        />\n       ) : null}\n\n'''
      text = text[:start] + replacement + text[end:]
      text = text.replace('import { SegmentedControl } from "@/components/ui/segmented-control";\n', "")
      text = text.replace(' ReaderHanziText,\n', "")
      text = text.replace(' translationSourceText,\n', "")
      path.write_text(text)

      path = Path("src/features/hanzihome/practice/StudioDictationWorkspace.tsx")
      text = path.read_text()
      text = replace_once(
       text,
       'import { StudioDictationPracticePanel } from "@/features/hanzihome/practice/StudioDictationPracticePanel";\n',
       'import { StudioDictationPracticePanel } from "@/features/hanzihome/practice/StudioDictationPracticePanel";\nimport { StudioDictationReferencePanel } from "@/features/hanzihome/practice/StudioDictationReferencePanel";\n',
       "dictation reference import",
      )
      panel_start = text.find('     <StudioDictationPracticePanel\n')
      error_start = text.find('     {attemptSaveError ? (\n', panel_start)
      if panel_start < 0 or error_start < 0:
       raise SystemExit("dictation practice panel markers not found")
      panel = text[panel_start:error_start].rstrip()
      indented_panel = "\n".join("       " + line.lstrip() if index == 0 else " " + line for index, line in enumerate(panel.splitlines()))
      wrapped = '''     <div className="grid min-w-0 gap-4 xl:grid-cols-[minmax(0,1fr)_22rem]">\n      <div className="min-w-0">\n''' + indented_panel + '''\n      </div>\n      <aside className="min-w-0 xl:sticky xl:top-3 xl:self-start">\n       <StudioDictationReferencePanel\n        activeIndex={effectiveActiveEntryIndex}\n        entries={sourceEntries}\n        isPlaybackActive={tts.isLoading || tts.isPaused || tts.isSpeaking}\n        sourceLabel={\n         selectedBook?.title || selectedSection?.titleVi || selectedClip?.title || "Bài đang học"\n        }\n        titleVi={\n         initialReaderResource?.document.title_vi ||\n         selectedReaderResource?.document.title_vi ||\n         selectedSection?.titleVi ||\n         selectedClip?.title ||\n         "Nguồn tự chọn"\n        }\n        titleZh={\n         initialReaderResource?.document.title_zh ??\n         selectedReaderResource?.document.title_zh ??\n         selectedSection?.titleZh ??\n         selectedClip?.title ??\n         "Nội dung tự chọn"\n        }\n       />\n      </aside>\n     </div>\n'''
      text = text[:panel_start] + wrapped + text[error_start:]
      path.write_text(text)
      PY
   - run: npm run format
   - run: npm run check
   - name: Commit verified parity follow-up
     run: |
      git rm -f .github/workflows/finalize-learning-parity-followup-v2.yml
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git commit -m "fix(hanzihome): restore migrated learning UI parity [learning-parity-followup]"
      git push origin HEAD:audit/hanzi-ui-parity
