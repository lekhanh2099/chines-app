name: Temporary micro UI normalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ui-micro-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.event.pull_request.head.ref == 'refactor/ui-system-ux-architecture' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --global npm@11.6.1
      - run: npm ci

      - name: Apply audited exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              file = Path(path)
              text = file.read_text()
              found = text.count(old)
              expected = 1 if count is None else count
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {found}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "src/components/layout/Sidebar.tsx",
              'isCollapsed ? "space-y-2 px-3" : "px-3"',
              'isCollapsed ? "grid content-start gap-2 px-3" : "px-3"',
          )

          replace(
              "src/components/editor/EditorFloatingMenu.tsx",
              'className="mx-1 h-5"',
              'className="h-5"',
              3,
          )
          replace(
              "src/components/editor/EditorFloatingMenu.tsx",
              '<div className="text-center">',
              '<div className="grid gap-1 text-center">',
              3,
          )
          replace(
              "src/components/editor/EditorFloatingMenu.tsx",
              ' className="mt-1"',
              '',
              3,
          )

          replace(
              "src/components/editor/plugins/ToolbarPlugin.tsx",
              'className="w-4 h-4 mr-2 shrink-0"',
              'className="size-4 shrink-0"',
              2,
          )

          replace(
              "src/features/hanzihome/HanziHomeReadingSettingsSection.tsx",
              'className="min-w-0 space-y-1"',
              'className="grid min-w-0 gap-1"',
          )

          replace(
              "src/features/developer-api/DeveloperApiPage.tsx",
              'import { PageHeader } from "@/components/ui/page-header";',
              'import { PageHeader } from "@/components/ui/page-header";\nimport { focusRingClassName } from "@/components/ui/focus-ring";',
          )
          replace(
              "src/features/developer-api/DeveloperApiPage.tsx",
              'className="flex cursor-pointer list-none items-start justify-between gap-3 p-4 marker:content-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/20 sm:p-5 [&::-webkit-details-marker]:hidden"',
              'className={`flex cursor-pointer list-none items-start justify-between gap-3 p-4 marker:content-none sm:p-5 [&::-webkit-details-marker]:hidden ${focusRingClassName}`}',
          )

          replace(
              "src/features/hanzihome/components/RadicalEditDialog.tsx",
              'import { Button } from "@/components/ui/button";',
              'import { Button } from "@/components/ui/button";\nimport { focusWithinRingClassName } from "@/components/ui/focus-ring";',
          )
          replace(
              "src/features/hanzihome/components/RadicalEditDialog.tsx",
              'className="h-[clamp(26rem,58dvh,42rem)] overflow-hidden rounded-xl border border-border-default bg-bg-primary shadow-inner focus-within:ring-2 focus-within:ring-ring [&_.cm-activeLine]:bg-primary/5 [&_.cm-activeLineGutter]:bg-primary/10 [&_.cm-content]:min-h-full [&_.cm-content]:py-3 [&_.cm-editor]:h-full [&_.cm-editor]:bg-bg-primary [&_.cm-focused]:outline-none [&_.cm-gutters]:border-border-default [&_.cm-gutters]:bg-bg-elevated/70 [&_.cm-line]:px-3 [&_.cm-scroller]:font-mono [&_.cm-scroller]:text-xs [&_.cm-theme-light]:h-full"',
              'className={`h-[clamp(26rem,58dvh,42rem)] overflow-hidden rounded-xl border border-border-default bg-bg-primary shadow-inner [&_.cm-activeLine]:bg-primary/5 [&_.cm-activeLineGutter]:bg-primary/10 [&_.cm-content]:min-h-full [&_.cm-content]:py-3 [&_.cm-editor]:h-full [&_.cm-editor]:bg-bg-primary [&_.cm-focused]:outline-none [&_.cm-gutters]:border-border-default [&_.cm-gutters]:bg-bg-elevated/70 [&_.cm-line]:px-3 [&_.cm-scroller]:font-mono [&_.cm-scroller]:text-xs [&_.cm-theme-light]:h-full ${focusWithinRingClassName}`}',
          )

          replace(
              "src/features/hanzihome/html-artifacts/HanziHomeHtmlArtifactsPage.tsx",
              'import { Input } from "@/components/ui/input";',
              'import { Input } from "@/components/ui/input";\nimport { focusWithinRingClassName } from "@/components/ui/focus-ring";',
          )
          for old, new in [
              ("ring-info/20", "border-info/20"),
              ("ring-purple/20", "border-purple/20"),
              ("ring-success/20", "border-success/20"),
              ("ring-warning/20", "border-warning/20"),
              ("ring-danger/20", "border-danger/20"),
              ("ring-border-default", "border-border-default"),
          ]:
              replace("src/features/hanzihome/html-artifacts/HanziHomeHtmlArtifactsPage.tsx", old, new)
          replace(
              "src/features/hanzihome/html-artifacts/HanziHomeHtmlArtifactsPage.tsx",
              '"flex h-6 w-6 shrink-0 items-center justify-center rounded-md ring-1",',
              '"flex h-6 w-6 shrink-0 items-center justify-center rounded-md border",',
          )
          replace(
              "src/features/hanzihome/html-artifacts/HanziHomeHtmlArtifactsPage.tsx",
              'shadow-inner focus-within:ring-2 focus-within:ring-ring [&_.cm-activeLine]',
              'shadow-inner [&_.cm-activeLine]',
          )
          replace(
              "src/features/hanzihome/html-artifacts/HanziHomeHtmlArtifactsPage.tsx",
              '    fullHeight ? "min-h-0 flex-1" : "h-[clamp(18rem,48dvh,34rem)]",',
              '    focusWithinRingClassName,\n    fullHeight ? "min-h-0 flex-1" : "h-[clamp(18rem,48dvh,34rem)]",',
          )
          PY

      - run: npm run format
      - run: git checkout -- .github/workflows/ui-micro-normalize-temp.yml

      - name: Commit normalized UI details
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: normalize micro UI spacing and focus"
          git push origin "HEAD:${HEAD_REF}"
