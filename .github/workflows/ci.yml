name: CI

on:
 push:
  branches: [main]
 pull_request:
 workflow_dispatch:

permissions:
 contents: read

concurrency:
 group: ci-${{ github.ref }}
 cancel-in-progress: true

jobs:
 verify:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  env:
   HUSKY: 0
  steps:
   - uses: actions/checkout@v5

   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm

   - run: npm install --global npm@11.6.1
   - run: npm ci
   - run: npm run format
   - uses: actions/upload-artifact@v4
     with:
      name: formatted-ai-files
      path: |
       src/app/api/ai/conversation/route.test.ts
       src/app/api/settings/api-keys/route.ts
       src/components/settings/ApiKeyManagerSection.tsx
       src/features/hanzihome/ai-conversation/AiConversationWorkspace.tsx
       src/features/hanzihome/ai-conversation/ai-conversation-api.ts
       src/features/hanzihome/ai-conversation/ai-conversation-system.server.test.ts
       src/features/settings/api-key-discovery.server.test.ts
       src/features/settings/api-key-discovery.server.ts
       src/features/settings/api-key-manager.client.ts
       src/lib/encryption.ts
   - run: git diff --exit-code
