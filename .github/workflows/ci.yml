name: CI

on:
 push:
  branches: [main, refactor/hanzihome-integrity-remediation]
 pull_request:
 workflow_dispatch:

permissions:
 contents: read

concurrency:
 group: ci-${{ github.ref }}
 cancel-in-progress: true

jobs:
 verify:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  env:
   HUSKY: 0
  steps:
   - uses: actions/checkout@v5

   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm

   - run: npm install --global npm@12.2.0
   - run: npm ci
   - run: npm run check
     env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

 e2e:
  runs-on: ubuntu-latest
  timeout-minutes: 35
  env:
   HUSKY: 0
   E2E_BASE_URL: http://127.0.0.1:3001
   E2E_USER_A_EMAIL: hanzihome-e2e-a@example.test
   E2E_USER_B_EMAIL: hanzihome-e2e-b@example.test
   E2E_FIXTURE_PASSWORD: HanziHome-E2E!2026
  steps:
   - uses: actions/checkout@v5

   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm

   - run: npm install --global npm@12.2.0
   - run: npm ci
   - run: npx playwright install --with-deps chromium
   - name: Apply canonical local schema baseline
     shell: bash
     run: |
      npx supabase start
      npx supabase db reset
   - name: Export local Supabase environment
     shell: bash
     run: |
      eval "$(npx supabase status -o env)"
      {
       echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
       echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
       echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
      } >> "$GITHUB_ENV"
   - name: Verify local Supabase REST readiness
     shell: bash
     run: |
      for attempt in {1..30}; do
       response_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
        -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
        "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" || true)"
       if [ "$response_code" = "200" ]; then
        echo "Local Supabase REST is ready on attempt $attempt."
        exit 0
       fi
       echo "Waiting for local Supabase REST (attempt $attempt, HTTP $response_code)."
       sleep 2
      done
      echo "Local Supabase REST did not become ready." >&2
      exit 1
   - name: Verify local database contracts
     run: |
      npx supabase test db --local supabase/tests/hanzihome_full_crud_test.sql supabase/tests/user_ai_task_routing_rls.test.sql
      docker exec -i supabase_db_chines-app psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/auth_session_limit.test.sql
   - name: Verify mounted browser fixtures
     run: >-
      npm run test:run --
      src/features/notes/hooks/NoteEditor.browser.test.ts
      src/features/hanzihome/tts/TtsAudioPreview.browser.test.ts
      src/features/hanzihome/listening/ListeningExercises.browser.test.ts
      src/features/reading/hooks/ShadowingRecorder.browser.test.ts
      src/features/reading/workspaces/Reading.browser.test.ts
      src/features/reader/runtime/Reader.browser.test.ts
     env:
      NOTES_BROWSER_TEST: "1"
      TTS_BROWSER_TEST: "1"
      LISTENING_BROWSER_TEST: "1"
      RECORDER_BROWSER_TEST: "1"
      READER_BROWSER_TEST: "1"
   - run: npm run e2e:seed
   - run: npm run test:e2e
   - if: always()
     run: npx supabase stop
