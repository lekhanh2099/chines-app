name: Repair lockfile

on:
 pull_request:

permissions:
 contents: write

jobs:
 repair:
  if: github.event.pull_request.head.repo.full_name == github.repository
  runs-on: ubuntu-latest
  timeout-minutes: 10
  env:
   HUSKY: 0
  steps:
   - uses: actions/checkout@v5
     with:
      ref: ${{ github.event.pull_request.head.ref }}

   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm

   - run: npm install --global npm@11.6.1
   - run: npm install --package-lock-only --ignore-scripts next-intl@4.13.4

   - name: Commit repaired lockfile
     run: |
      if git diff --quiet -- package.json package-lock.json; then
        echo "Lockfile already synchronized."
        exit 0
      fi
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add package.json package-lock.json
      git commit -m "chore(deps): sync next-intl lockfile"
      git push origin HEAD:${{ github.event.pull_request.head.ref }}
