name: Hanzi format once

on:
 push:
  branches: [migration/hanzi-consolidation]

permissions:
 contents: write

concurrency:
 group: hanzi-format-once-${{ github.ref }}
 cancel-in-progress: true

jobs:
 format:
  if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
  runs-on: ubuntu-latest
  timeout-minutes: 10
  env:
   HUSKY: 0
  steps:
   - uses: actions/checkout@v5
     with:
      ref: migration/hanzi-consolidation
   - uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: npm
   - run: npm install --global npm@11.6.1
   - run: npm ci
   - run: npx oxlint --fix .
   - run: npm run format
   - name: Commit formatter output
     run: |
      if git diff --quiet; then
        exit 0
      fi
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add --all
      git commit -m "style: apply automated fixes [autoformat]"
      git push origin HEAD:migration/hanzi-consolidation
